<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фруктохранилище</title>
<style>
:root{--bg:#f3f6f9;--card:#fff;--text:#17212b;--muted:#687785;--line:#dce4ea;--green:#16a34a;--blue:#2563eb;--yellow:#d97706;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{height:68px;background:#102a43;color:#fff;display:flex;align-items:center;padding:0 24px;gap:18px}
.logo{font-size:24px}.brand{font-weight:800;font-size:19px}.sub{font-size:12px;color:#b9c8d6}
main{padding:22px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.title h1{margin:0;font-size:27px}.title p{margin:5px 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}button,.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--text)}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button.green{background:var(--green);color:#fff;border-color:var(--green)}button.warn{background:#f59e0b;color:#fff;border-color:#f59e0b}button.danger{background:#dc2626;color:#fff;border-color:#dc2626}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filters button{font-size:12px}.filters button.sel{background:#e8f0ff;border-color:#9bbcf8;color:#1d4ed8}
.layout{display:grid;grid-template-columns:minmax(560px,1fr) 370px;gap:16px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:9px}
.cam{min-height:108px;background:white;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;position:relative;box-shadow:0 1px 2px #00000008}
.cam:hover{transform:translateY(-1px);box-shadow:0 3px 10px #00000012}.cam.selected{outline:2px solid #2563eb}
.cam.storage{background:#ecfdf3;border-color:#a7e3ba}.cam.rgs{background:#eff6ff;border-color:#a9c9fb}.cam.process{background:#fffbeb;border-color:#f4d06f}.cam.problem{background:#fef2f2;border-color:#f4aaaa}.cam.empty{background:#f8fafc;color:#64748b}
.cam .num{font-weight:800}.cam .sort{font-size:12px;margin-top:8px;font-weight:700}.cam .qty{font-size:11px;color:#596876;margin-top:3px}.status{font-size:11px;margin-top:8px;font-weight:700}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--green)}.rgs .dot{background:var(--blue)}.process .dot{background:#eab308}.problem .dot{background:var(--red)}.empty .dot{background:#94a3b8}
.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:16px}.panel h2{margin:0 0 12px;font-size:20px}.badge{float:right;padding:5px 9px;border-radius:15px;font-size:11px;font-weight:700;background:#dcfce7;color:#15803d}.info{border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px}.row span:first-child{color:var(--muted)}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.buttons button{font-size:11px;padding:10px 5px}
.history{margin-top:14px}.history h3{font-size:14px;margin:0 0 8px}.event{border-left:3px solid #9ca3af;padding:7px 0 7px 10px;font-size:12px}.event b{display:block}.event small{color:var(--muted)}
.journal{background:white;border:1px solid var(--line);border-radius:12px;margin-top:16px;padding:15px;overflow:auto}.journal h2{font-size:17px;margin:0 0 10px}.journal table{width:100%;border-collapse:collapse;font-size:12px}.journal th,.journal td{text-align:left;padding:8px;border-bottom:1px solid #edf1f4;white-space:nowrap}.journal th{color:var(--muted)}
.search{min-width:250px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modalbox{background:white;border-radius:14px;width:min(650px,100%);padding:20px;max-height:90vh;overflow:auto}.modalbox h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit;background:white}textarea{min-height:70px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.panel{position:static}.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:12px}.top{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">🍎</div>
  <div><div class="brand">Фруктохранилище</div><div class="sub">Учет камер, партий и операций</div></div>
</header>
<main>
<div class="top">
  <div class="title"><h1>Камеры (56)</h1><p id="summary">Загрузка…</p></div>
  <div class="actions">
    <input id="search" class="search" placeholder="Поиск...">
    <button onclick="exportData()">⬇ Экспорт</button>
    <button onclick="importData()">⬆ Импорт</button>
    <button class="danger" onclick="resetData()">Сброс</button>
  </div>
</div>
<div class="filters" id="filters"></div>
<div class="layout">
  <section>
    <div id="grid" class="grid"></div>
    <div class="journal"><h2>Журнал операций</h2><table><thead><tr><th>Дата</th><th>Камера</th><th>Операция</th><th>Сорт</th><th>Партия</th><th>Кол-во</th></tr></thead><tbody id="journal"></tbody></table></div>
  </section>
  <section class="panel" id="panel"></section>
</div>
</main>
<div class="modal" id="modal"><div class="modalbox"><h2>Данные камеры</h2>
<form class="form" onsubmit="return false">
<div class="field"><label>Статус</label><select id="fStatus"><option value="storage">Хранение</option><option value="process">Обработка</option><option value="rgs">На РГС</option><option value="problem">Проблема</option><option value="empty">Пустая</option></select></div>
<div class="field"><label>Культура</label><input id="fCrop"></div>
<div class="field"><label>Сорт</label><input id="fSort"></div>
<div class="field"><label>Партия</label><input id="fBatch"></div>
<div class="field"><label>Количество, кг</label><input id="fQty" type="number" min="0"></div>
<div class="field"><label>Температура °C</label><input id="fTemp" type="number" step="0.1"></div>
<div class="field"><label>Влажность %</label><input id="fHum" type="number" min="0" max="100"></div>
<div class="field"><label>Оператор</label><input id="fOperator"></div>
<div class="field full"><label>Примечание</label><textarea id="fNote"></textarea></div>
</form>
<div class="modal-actions"><button onclick="closeForm()">Отмена</button><button class="primary" onclick="saveForm()">Сохранить</button></div>
</div></div>
<input type="file" id="importFile" accept=".json" style="display:none">
<script>
const key='fruitstore_v1';
const names={all:'Все',storage:'Хранение',process:'Обработка',rgs:'На РГС',problem:'Проблема',empty:'Пустые'};
const now=()=>new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
let data=JSON.parse(localStorage.getItem(key)||'null');
let selected=1, filter='all';

function seed(){let sorts=['Голден','Гала','Фуджи','Груша','Айдаред','Морковь','Лук','Капуста','NameСвекла='','Ред Чиф'];let a=sel[]';;for(let i=1;i<=56;ib++){let st.on=i%14===0?'empty':i%7===0?'rgs':i%9===0?'process':'storage';let s=sorts[(i-1)%sorts.length];a.push({id:i,status:st,crop:['Морковь','Лук','Капуста','Свекла'].includes(s)?'Овощи':'Яблоко',sort:s,batch:'П-'+(240+i),qty:st==='empty'?0:(10+(i%16))*1000,temp:1.5,hum:90,note:'',operator:'Оператор',history:[{time:now(),op:'Загрузка камеры'}]})}return a}
if(!data){data={cams:seed(),journal:[]};localStorage.setItem(key,JSON.stringify(data));}
function save(){localStorage.setItem(key,JSON.stringify(data));}

function renderFilters(){const f=document.getElementById('filters');f.innerHTML='';Object.keys(names).forEach(k=>{const b=document.createElement('button');const cnt=k==='all'?data.cams.length:data.cams.filter(x=>x.status===k).length;b.textContent=names[k]+' ('+cnt+')';if(filter===k)b.classclick=()=>{filter=k;render();};f.appendChild(b);});}

function[c render(){
  renderFilters();
  const q=(document.getElementById('search').value||'').toLowerCase.status();
  const list=data].cams.filter(c=>(filter==='=(all'||c.status===filter)&&count((c.id+' '+(c.sort||'')+' '+(c.batch||'')+' '+(c.crop||'')).toLowerCase().includes(q)));
  document.getElementById('grid').innerHTML=list.map(c=>`<div class="cam ${c.status} ${selected===c.id?'selected':''}" onclick="selectCam(${c.id})"><div class="num">● ${String(c.id).padStart(2,'0')}</div><div class="sort">${c.sort||'—'}</div><div class="qty">${(c.qty||0).toLocaleString('ru-RU')} кг</div><div class="status"><span class="dot"></span>${names[c.status]||c.status}</div></div>`).join('');
  const counts={};data.cams.forEach(c=>countss[c.status]||0)+1);
  document.getElementById('summary').textContent=`Хранение: ${counts.storage||0} · Обработка: ${counts.process||0} · РГС: ${counts.rgs||0} · Пустые: ${counts.empty||0} · Проблема: ${counts.problem||0}`;
  renderPanel();renderJournal();
}
function selectCam(id){selected=id;render();}

function renderPanel(){
  const c=data.cams.find(x=>x.id===selected);if(!c)return;
  const hist=(c.history||[]).slice().reverse().slice(0,5);
  document.getElementById('panel').innerHTML=`
    <h2>🍎 Камера №${String(c.id).padStart(2,'0')} <span class="badge">${names[c.status]||c.status}</span></h2>
    <div class="info">
      <div class="row"><span>Культура</span><b>${c.crop||'—'}</b></div>
      <div class="row"><span>Сорт</span><b>${c.sort||'—'}</b></div>
      <div class="row"><span>Партия</span><b>${c.batch||'—'}</b></div>
      <div class="row"><span>Количество</span><b>${(c.qty||0).toLocaleString('ru-RU')} кг</b></div>
    </div>
    <div class="info">
      <div class="row"><span>Температура</span><b>${c.temp!=null?c.temp+' °C':'—'}</b></div>
      <div class="row"><span>Влажность</span><b>${c.hum!=null?c.hum+' %':'—'}</b></div>
      <div class="row"><span>Оператор</span><b>${c.operator||'—'}</b></div>
    </div>
    <div class="buttons">
      <button class="warn" onclick="quick(${c.id},'process')">Обработка</button>
      <button class="primary" onclick="quick(${c.id},'rgs')">РГС</button>
      <button class="green" onclick="quick(${c.id},'storage')">Хранение</button>
    </div>
    <button style="width:100%" onclick="openForm(${c.id})">✎ Редактировать</button>
    <div class="history"><h3>История операций</h3>${hist.length?hist.map(h=>`<div class="event"><b>${h.op}</b><small>${h.time}</small></div>`).join(''):'<div style="color:#687785;font-size:12px">История пока пуста</div>'}</div>`;
}
function renderJournal(){
  document.getElementById('journal').innerHTML=data.journal.slice().reverse().slice(0,20).map(x=>`<tr><td>${x.time}</td><td>${x.cam}</td><td>${x.op}</td><td>${x.sort||'—'}</td><td>${x.batch||'—'}</td><td>${x.qty?x.qty.toLocaleString('ru-RU')+' кг':'—'}</td></tr>`).join('')||'<tr><td colspan="6">Операций пока нет</td></tr>';
}
function log(c,op){c.history=c.history||[];c.history.push({time:now(),op});data.journal.push({time:now(),cam:String(c.id).padStart(2,'0'),op,sort:c.sort,batch:c.batch,qty:c.qty});}

function quick(id,st){
  const c=data.cams.find(x=>x.id===id);
  c.status=st;
  const opName=st==='process'?'Начало обработки':st==='rgs'?'Начало РГС':'Изменение статуса';
  log(c,opName);save();render();
}

function openForm(id){
  const c=data.cams.find(x=>x.id===id);selected=id;
  ['status','crop','sort','batch','qty','temp','hum','operator','note'].forEach(k=>{
    document.getElementById('f'+k.charAt(0).toUpperCase()+k.slice(1)).value=c[k]??'';
  });
  document.getElementById('modal').classList.add('open');
}
function closeForm(){document.getElementById('modal').classList.remove('open');}
function saveForm(){
  const c=data.cams.find(x=>x.id===selected);
  c.status=document.getElementById('fStatus').value;
  c.crop=document.getElementById('fCrop').value;
  c.sort=document.getElementById('fSort').value;
  c.batch=document.getElementById('fBatch').value;
  c.qty=Number(document.getElementById('fQty').value)||0;
  c.temp=document.getElementById('fTemp').value===''?null:Number(document.getElementById('fTemp').value);
  c.hum=document.getElementById('fHum').value===''?null:Number(document.getElementById('fHum').value);
  c.operator=document.getElementById('fOperator').value;
  c.note=document.getElementById('fNote').value;
  log(c,'Изменение данных');save();closeForm();render();
}

function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='fruitstore-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importData(){document.getElementById('importFile').click();}
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const parsed=JSON.parse(r.result);if(parsed.cams){data=parsed;save();render();alert('Данные загружены');}else alert('Неверный формат файла');}catch(err){alert('Ошибка чтения файла: '+err.message);}};
  r.readAsText(f);
});
function resetData(){
  if(!confirm('Сбросить все данные и вернуть 56 камер по умолчанию?'))return;
  data={cams:seed(),journal:[]};save();render();
}

document.getElementById('search').addEventListener('input',render);
render();
</script>
</body>
</html>
