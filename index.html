<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фруктохранилище</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f6f9;--card:#fff;--text:#17212b;--muted:#687785;--line:#dce4ea;--green:#16a34a;--blue:#2563eb;--yellow:#d97706;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{height:68px;background:#102a43;color:#fff;display:flex;align-items:center;padding:0 24px;gap:18px}
.logo{font-size:24px}.brand{font-weight:800;font-size:19px}.sub{font-size:12px;color:#b9c8d6}
.wrap{display:flex;min-height:calc(100vh - 68px)}aside{width:220px;background:#102a43;color:#d9e4ec;padding:18px 12px}
nav button{width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:13px 14px;border-radius:9px;margin:3px 0;font-size:14px;cursor:pointer}
nav button.active,nav button:hover{background:#1d4f7a;color:white}
main{flex:1;padding:22px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title h1{margin:0;font-size:27px}.title p{margin:5px 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}button,.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--text)}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button.green{background:var(--green);color:#fff;border-color:var(--green)}button.warn{background:#f59e0b;color:#fff;border-color:#f59e0b}button.danger{background:#dc2626;color:#fff;border-color:#dc2626}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filters button{font-size:12px}.filters button.sel{background:#e8f0ff;border-color:#9bbcf8;color:#1d4ed8}
.layout{display:grid;grid-template-columns:minmax(560px,1fr) 370px;gap:16px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:9px}
.cam{min-height:108px;background:white;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;position:relative;box-shadow:0 1px 2px #00000008}
.cam:hover{transform:translateY(-1px);box-shadow:0 3px 10px #00000012}.cam.selected{outline:2px solid #2563eb}
.cam.storage{background:#ecfdf3;border-color:#a7e3ba}.cam.rgs{background:#eff6ff;border-color:#a9c9fb}.cam.process{background:#fffbeb;border-color:#f4d06f}.cam.problem{background:#fef2f2;border-color:#f4aaaa}.cam.empty{background:#f8fafc;color:#64748b}
.cam .num{font-weight:800}.cam .sort{font-size:12px;margin-top:8px;font-weight:700}.cam .qty{font-size:11px;color:#596876;margin-top:3px}.status{font-size:11px;margin-top:8px;font-weight:700}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--green)}.rgs .dot{background:var(--blue)}.process .dot{background:#eab308}.problem .dot{background:var(--red)}.empty .dot{background:#94a3b8}
.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:16px}.panel h2{margin:0 0 12px;font-size:20px}.badge{float:right;padding:5px 9px;border-radius:15px;font-size:11px;font-weight:700;background:#dcfce7;color:#15803d}.info{border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px}.row span:first-child{color:var(--muted)}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.buttons button{font-size:11px;padding:10px 5px}
.history{margin-top:14px}.history h3{font-size:14px;margin:0 0 8px}.event{border-left:3px solid #9ca3af;padding:7px 0 7px 10px;font-size:12px}.event b{display:block}.event small{color:var(--muted)}
.journal{background:white;border:1px solid var(--line);border-radius:12px;margin-top:16px;padding:15px;overflow:auto}.journal h2{font-size:17px;margin:0 0 10px}.journal table{width:100%;border-collapse:collapse;font-size:12px}.journal th,.journal td{text-align:left;padding:8px;border-bottom:1px solid #edf1f4;white-space:nowrap}.journal th{color:var(--muted)}
.search{min-width:250px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modalbox{background:white;border-radius:14px;width:min(650px,100%);padding:20px;max-height:90vh;overflow:auto}.modalbox h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit;background:white}textarea{min-height:70px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:white;border-radius:14px;padding:26px;width:min(400px,100%);box-shadow:0 8px 40px #0001}
.login-box h1{margin:0 0 6px;font-size:22px}.login-box p{margin:0 0 20px;color:var(--muted);font-size:13px}
.login-box input{width:100%;margin-bottom:10px;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}
.login-box button{width:100%;padding:12px;background:var(--blue);color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin-bottom:8px}
.login-box button.alt{background:white;color:var(--blue);border:1px solid var(--blue)}
.err{background:#fef2f2;color:#dc2626;padding:10px;border-radius:8px;font-size:13px;margin-bottom:10px;display:none}
.err.show{display:block}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.panel{position:static}.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){aside{display:none}.grid{grid-template-columns:repeat(2,1fr)}main{padding:12px}.top{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <h1>🍎 Фруктохранилище</h1>
    <p>Учёт 56 камер</p>
    <div id="errBox" class="err"></div>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="pass" type="password" placeholder="Пароль (минимум 6 символов)" autocomplete="current-password">
    <button onclick="doLogin()">Войти</button>
    <button class="alt" onclick="doSignup()">Создать аккаунт</button>
  </div>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div id="appScreen" style="display:none">
<header>
  <div class="logo">🍎</div>
  <div><div class="brand">Фруктохранилище</div><div class="sub">Учет камер, партий и операций</div></div>
  <div style="margin-left:auto"><button onclick="doLogout()" style="background:#1d4f7a;color:#fff;border:0">Выйти</button></div>
</header>
<div class="wrap">
<main>
<div class="top">
  <div class="title"><h1>Камеры (56)</h1><p id="summary">Загрузка…</p></div>
  <div class="actions"><input id="search" class="search" placeholder="Поиск..."></div>
</div>
<div class="filters" id="filters"></div>
<div class="layout">
  <section>
    <div id="grid" class="grid"></div>
    <div class="journal"><h2>Журнал операций</h2><table><thead><tr><th>Дата</th><th>Камера</th><th>Операция</th><th>Сорт</th><th>Партия</th><th>Кол-во</th></tr></thead><tbody id="journal"></tbody></table></div>
  </section>
  <section class="panel" id="panel"></section>
</div>
</main>
</div>
<div class="modal" id="modal"><div class="modalbox"><h2>Данные камеры</h2>
<form id="form" class="form" onsubmit="return false">
<div class="field"><label>Статус</label><select id="fStatus"><option value="storage">Хранение</option><option value="process">Обработка</option><option value="rgs">На РГС</option><option value="problem">Проблема</option><option value="empty">Пустая</option></select></div>
<div class="field"><label>Культура</label><input id="fCrop"></div>
<div class="field"><label>Сорт</label><input id="fSort"></div>
<div class="field"><label>Партия</label><input id="fBatch"></div>
<div class="field"><label>Количество, кг</label><input id="fQty" type="number" min="0"></div>
<div class="field"><label>Температура °C</label><input id="fTemp" type="number" step="0.1"></div>
<div class="field"><label>Влажность %</label><input id="fHum" type="number" min="0" max="100"></div>
<div class="field"><label>Оператор</label><input id="fOperator"></div>
<div class="field full"><label>Примечание</label><textarea id="fNote"></textarea></div>
</form>
<div class="modal-actions"><button onclick="closeForm()">Отмена</button><button class="primary" onclick="saveForm()">Сохранить</button></div>
</div></div>
</div>

<script>
const SUPABASE_URL = 'https://slbklquxtujnbvcazvq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsYmtscXV6eHR1am5idmNhenZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NjYyNzcsImV4cCI6MjEwNjM0MjI3N30.EGX8MEhRFnYk8ikuajRD1JHq5zsE17kLWlCYwswjBAc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const names = {all:'Все',storage:'Хранение',process:'Обработка',rgs:'На РГС',problem:'Проблема',empty:'Пустые'};
let cams = [], journal = [], selected = 1, filter = 'all', currentUser = null;

function showErr(msg){const b=document.getElementById('errBox');b.textContent=msg;b.classList.add('show');}
function hideErr(){document.getElementById('errBox').classList.remove('show');}

async function doLogin(){
  hideErr();
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  if(!email||!pass){showErr('Введи email и пароль');return;}
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){showErr('Ошибка входа: '+error.message);return;}
  startApp();
}
async function doSignup(){
  hideErr();
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  if(!email||!pass){showErr('Введи email и пароль');return;}
  if(pass.length<6){showErr('Пароль минимум 6 символов');return;}
  const {error}=await sb.auth.signUp({email,password:pass});
  if(error){showErr('Ошибка регистрации: '+error.message);return;}
  const {error:e2}=await sb.auth.signInWithPassword({email,password:pass});
  if(e2){showErr('Аккаунт создан, но войти не удалось: '+e2.message+'. Попробуй «Войти».');return;}
  startApp();
}
async function doLogout(){await sb.auth.signOut();location.reload();}

async function startApp(){
  const {data:{user}}=await sb.auth.getUser();
  currentUser=user;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  await loadData();
}

async function loadData(){
  const {data:c,error:e1}=await sb.from('cameras').select('*').order('id');
  if(e1){alert('Ошибка загрузки камер: '+e1.message);return;}
  cams=c||[];
  const {data:j}=await sb.from('journal').select('*').order('created_at',{ascending:false}).limit(50);
  journal=j||[];
  render();
}

function fmt(v){if(!v)return '—';return new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}

function renderFilters(){
  const f=document.getElementById('filters');f.innerHTML='';
  Object.keys(names).forEach(k=>{
    const b=document.createElement('button');
    const cnt = k==='all'?cams.length:cams.filter(x=>x.status===k).length;
    b.textContent=names[k]+' ('+cnt+')';
    if(filter===k)b.className='sel';
    b.onclick=()=>{filter=k;render();};
    f.appendChild(b);
  });
}

function render(){
  renderFilters();
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=cams.filter(c=>(filter==='all'||c.status===filter)&&((c.id+' '+(c.sort||'')+' '+(c.batch||'')+' '+(c.crop||'')).toLowerCase().includes(q)));
  document.getElementById('grid').innerHTML=list.map(c=>`<div class="cam ${c.status} ${selected===c.id?'selected':''}" onclick="selectCam(${c.id})"><div class="num">● ${String(c.id).padStart(2,'0')}</div><div class="sort">${c.sort||'—'}</div><div class="qty">${(c.qty||0).toLocaleString('ru-RU')} кг</div><div class="status"><span class="dot"></span>${names[c.status]||c.status}</div></div>`).join('');
  const counts={};cams.forEach(c=>counts[c.status]=(counts[c.status]||0)+1);
  document.getElementById('summary').textContent=`Хранение: ${counts.storage||0} · Обработка: ${counts.process||0} · РГС: ${counts.rgs||0} · Пустые: ${counts.empty||0} · Проблема: ${counts.problem||0}`;
  renderPanel();
  renderJournal();
}

function selectCam(id){selected=id;render();}

function renderPanel(){
  const c=cams.find(x=>x.id===selected);if(!c)return;
  document.getElementById('panel').innerHTML=`
    <h2>🍎 Камера №${String(c.id).padStart(2,'0')} <span class="badge">${names[c.status]||c.status}</span></h2>
    <div class="info">
      <div class="row"><span>Культура</span><b>${c.crop||'—'}</b></div>
      <div class="row"><span>Сорт</span><b>${c.sort||'—'}</b></div>
      <div class="row"><span>Партия</span><b>${c.batch||'—'}</b></div>
      <div class="row"><span>Количество</span><b>${(c.qty||0).toLocaleString('ru-RU')} кг</b></div>
    </div>
    <div class="info">
      <div class="row"><span>Температура</span><b>${c.temp!=null?c.temp+' °C':'—'}</b></div>
      <div class="row"><span>Влажность</span><b>${c.hum!=null?c.hum+' %':'—'}</b></div>
      <div class="row"><span>Оператор</span><b>${c.operator||'—'}</b></div>
    </div>
    <div class="buttons">
      <button class="warn" onclick="quick(${c.id},'process')">Обработка</button>
      <button class="primary" onclick="quick(${c.id},'rgs')">РГС</button>
      <button class="green" onclick="quick(${c.id},'storage')">Хранение</button>
    </div>
    <button style="width:100%" onclick="openForm(${c.id})">✎ Редактировать</button>
  `;
}

function renderJournal(){
  document.getElementById('journal').innerHTML=journal.slice(0,20).map(x=>`<tr><td>${fmt(x.created_at)}</td><td>${x.cam}</td><td>${x.op}</td><td>${x.sort||'—'}</td><td>${x.batch||'—'}</td><td>${x.qty?x.qty.toLocaleString('ru-RU')+' кг':'—'}</td></tr>`).join('')||'<tr><td colspan="6">Операций пока нет</td></tr>';
}

async function quick(id,st){
  const c=cams.find(x=>x.id===id);
  const upd={status:st,updated_at:new Date().toISOString()};
  if(st==='process')upd.process_at=new Date().toISOString();
  if(st==='rgs')upd.rgs_at=new Date().toISOString();
  const {error}=await sb.from('cameras').update(upd).eq('id',id);
  if(error){alert('Ошибка: '+error.message);return;}
  const opName = st==='process'?'Начало обработки':st==='rgs'?'Начало РГС':'Изменение статуса';
  await sb.from('journal').insert({cam:id,op:opName,sort:c.sort,batch:c.batch,qty:c.qty,user_email:currentUser?.email||''});
  await loadData();
}

function openForm(id){
  const c=cams.find(x=>x.id===id);
  selected=id;
  ['status','crop','sort','batch','qty','temp','hum','operator','note'].forEach(k=>{
    document.getElementById('f'+k.charAt(0).toUpperCase()+k.slice(1)).value=c[k]??'';
  });
  document.getElementById('modal').classList.add('open');
}
function closeForm(){document.getElementById('modal').classList.remove('open');}

async function saveForm(){
  const c=cams.find(x=>x.id===selected);
  const upd={
    status:document.getElementById('fStatus').value,
    crop:document.getElementById('fCrop').value,
    sort:document.getElementById('fSort').value,
    batch:document.getElementById('fBatch').value,
    qty:Number(document.getElementById('fQty').value)||0,
    temp:document.getElementById('fTemp').value===''?null:Number(document.getElementById('fTemp').value),
    hum:document.getElementById('fHum').value===''?null:Number(document.getElementById('fHum').value),
    operator:document.getElementById('fOperator').value,
    note:document.getElementById('fNote').value,
    updated_at:new Date().toISOString()
  };
  const {error}=await sb.from('cameras').update(upd).eq('id',selected);
  if(error){alert('Ошибка сохранения: '+error.message);return;}
  await sb.from('journal').insert({cam:selected,op:'Изменение данных',sort:upd.sort,batch:upd.batch,qty:upd.qty,user_email:currentUser?.email||''});
  closeForm();
  await loadData();
}

document.getElementById('search').addEventListener('input',render);

sb.auth.getSession().then(({data:{session}})=>{if(session)startApp();});
</script>
</body>
</html>
