<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фруктохранилище</title>
<style>
:root{--bg:#f3f6f9;--card:#fff;--text:#17212b;--muted:#687785;--line:#dce4ea;--green:#16a34a;--blue:#2563eb;--yellow:#d97706;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{height:68px;background:#102a43;color:#fff;display:flex;align-items:center;padding:0 24px;gap:18px}
.logo{font-size:24px}.brand{font-weight:800;font-size:19px}.sub{font-size:12px;color:#b9c8d6}
main{padding:22px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.title h1{margin:0;font-size:27px}.title p{margin:5px 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}button,.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--text)}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button.green{background:var(--green);color:#fff;border-color:var(--green)}button.warn{background:#f59e0b;color:#fff;border-color:#f59e0b}button.danger{background:#dc2626;color:#fff;border-color:#dc2626}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters button{font-size:12px}.filters button.sel{background:#e8f0ff;border-color:#9bbcf8;color:#1d4ed8}
.wingbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.wingbar button{font-size:13px;background:#f8fafc;border-color:#cbd5e1}
.wingbar button.sel{background:#102a43;color:#fff;border-color:#102a43}
.layout{display:grid;grid-template-columns:minmax(560px,1fr) 370px;gap:16px}
.wing-section{margin-bottom:22px}
.wing-title{font-size:16px;font-weight:800;color:#102a43;margin:0 0 10px;padding:8px 0;border-bottom:2px solid #102a43;display:flex;justify-content:space-between}
.wing-title span{font-weight:500;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:9px}
.cam{min-height:108px;background:white;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;position:relative;box-shadow:0 1px 2px #00000008}
.cam:hover{transform:translateY(-1px);box-shadow:0 3px 10px #00000012}.cam.selected{outline:2px solid #2563eb}
.cam.storage{background:#ecfdf3;border-color:#a7e3ba}.cam.rgs{background:#eff6ff;border-color:#a9c9fb}.cam.process{background:#fffbeb;border-color:#f4d06f}.cam.problem{background:#fef2f2;border-color:#f4aaaa}.cam.empty{background:#f8fafc;color:#64748b}.cam.inactive{background:#e2e8f0;border-color:#94a3b8;color:#475569}
.cam .num{font-weight:800}.cam .sort{font-size:12px;margin-top:8px;font-weight:700}.cam .qty{font-size:11px;color:#596876;margin-top:3px}.status{font-size:11px;margin-top:8px;font-weight:700}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--green)}.rgs .dot{background:var(--blue)}.process .dot{background:#eab308}.problem .dot{background:var(--red)}.empty .dot{background:#94a3b8}.inactive .dot{background:#475569}
.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:16px}.panel h2{margin:0 0 12px;font-size:20px}.badge{float:right;padding:5px 9px;border-radius:15px;font-size:11px;font-weight:700;background:#dcfce7;color:#15803d}.info{border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px}.row span:first-child{color:var(--muted)}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.buttons button{font-size:11px;padding:10px 5px}
.history{margin-top:14px}.history h3{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}.history h3 span{font-size:11px;color:var(--muted);font-weight:500}.event{border-left:3px solid #9ca3af;padding:7px 0 7px 10px;font-size:12px;margin-bottom:4px}.event b{display:block}.event small{color:var(--muted)}
.hist-scroll{max-height:280px;overflow-y:auto;padding-right:4px}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modalbox{background:white;border-radius:14px;width:min(650px,100%);padding:20px;max-height:90vh;overflow:auto}.modalbox h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit;background:white}textarea{min-height:70px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.hist-table{width:100%;border-collapse:collapse;font-size:12px}.hist-table th,.hist-table td{text-align:left;padding:8px;border-bottom:1px solid #edf1f4;white-space:nowrap}.hist-table th{color:var(--muted);position:sticky;top:0;background:white}
.search{min-width:250px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.panel{position:static}.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:12px}.top{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">🍎</div>
  <div><div class="brand">Фруктохранилище</div><div class="sub">Учет камер, партий и операций</div></div>
</header>
<main>
<div class="top">
  <div class="title"><h1>Камеры (56)</h1><p id="summary">Загрузка…</p></div>
  <div class="actions">
    <input id="search" class="search" placeholder="Поиск...">
    <button onclick="openAllHistory()">📋 Вся история</button>
    <button onclick="exportData()">⬇ Экспорт</button>
    <button onclick="importData()">⬆ Импорт</button>
    <button class="danger" onclick="resetData()">Сброс</button>
  </div>
</div>
<div class="filters" id="filters"></div>
<div class="wingbar" id="wingbar"></div>
<div class="layout">
  <section>
    <div id="grid"></div>
  </section>
  <section class="panel" id="panel"></section>
</div>
</main>

<!-- Модалка: данные камеры -->
<div class="modal" id="modal"><div class="modalbox"><h2>Данные камеры</h2>
<form class="form" onsubmit="return false">
<div class="field"><label>Статус</label><select id="fStatus"><option value="storage">Хранение</option><option value="process">Обработка</option><option value="rgs">На РГС</option><option value="inactive">Неактивная</option><option value="problem">Проблема</option><option value="empty">Пустая</option></select></div>
<div class="field"><label>Культура</label><input id="fCrop"></div>
<div class="field"><label>Сорт</label><input id="fSort"></div>
<div class="field"><label>Партия</label><input id="fBatch"></div>
<div class="field"><label>Количество, кг</label><input id="fQty" type="number" min="0"></div>
<div class="field"><label>Температура °C</label><input id="fTemp" type="number" step="0.1"></div>
<div class="field"><label>Влажность %</label><input id="fHum" type="number" min="0" max="100"></div>
<div class="field"><label>Оператор</label><input id="fOperator"></div>
<div class="field full"><label>Примечание</label><textarea id="fNote"></textarea></div>
</form>
<div class="modal-actions"><button onclick="closeForm()">Отмена</button><button class="primary" onclick="saveForm()">Сохранить</button></div>
</div></div>

<!-- Модалка: вся история -->
<div class="modal" id="histModal"><div class="modalbox" style="width:min(900px,100%)">
<h2>📋 Вся история операций</h2>
<div style="max-height:60vh;overflow:auto;margin-top:12px">
<table class="hist-table"><thead><tr><th>Дата</th><th>Камера</th><th>Крыло</th><th>Операция</th><th>Сорт</th><th>Партия</th><th>Кол-во</th></tr></thead><tbody id="histBody"></tbody></table>
</div>
<div class="modal-actions"><button onclick="closeHist()">Закрыть</button></div>
</div></div>

<input type="file" id="importFile" accept=".json" style="display:none">
<script>
const key='fruitstore_v4';
const names={all:'Все',storage:'Хранение',process:'Обработка',rgs:'На РГС',inactive:'Неактивные',problem:'Проблема',empty:'Пустые'};
const wingNames={1:'Крыло 1',2:'Крыло 2',3:'Крыло 3',4:'Крыло 4'};
const now=function(){return new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})};
function wingOf(id){return Math.floor((id-1)/14)+1;}
var data=JSON.parse(localStorage.getItem(key)||'null');
var selected=1, filter='all', wingFilter='all';

function seed(){var sorts=['Голден','Гала','Фуджи','Груша','Айдаред','Морковь','Лук','Капуста','Свекла','Ред Чиф'];var a=[];var jr=[];for(var i=1;i<=56;i++){var st=i%14===0?'empty':i%7===0?'rgs':i%9===0?'process':'storage';var s=sorts[(i-1)%sorts.length];var crop=(s==='Морковь'||s==='Лук'||s==='Капуста'||s==='Свекла')?'Овощи':'Яблоко';var qty=st==='empty'?0:(10+(i%16))*1000;a.push({id:i,wing:wingOf(i),status:st,crop:crop,sort:s,batch:'П-'+(240+i),qty:qty,temp:1.5,hum:90,note:'',operator:'Оператор'})}return a}
if(!data){data={cams:seed(),journal:[]};data.journal.push({time:now(),cam:'01',wing:1,op:'Загрузка камеры',sort:'Голден',batch:'П-241',qty:10000});localStorage.setItem(key,JSON.stringify(data));}
function save(){localStorage.setItem(key,JSON.stringify(data));}

function renderFilters(){var f=document.getElementById('filters');f.innerHTML='';Object.keys(names).forEach(function(k){var b=document.createElement('button');var cnt=k==='all'?data.cams.length:data.cams.filter(function(x){return x.status===k}).length;b.textContent=names[k]+' ('+cnt+')';if(filter===k)b.className='sel';b.onclick=function(){filter=k;render();};f.appendChild(b);});}

function renderWingbar(){var w=document.getElementById('wingbar');w.innerHTML='';var btnAll=document.createElement('button');btnAll.textContent='Все крылья (56)';if(wingFilter==='all')btnAll.className='sel';btnAll.onclick=function(){wingFilter='all';render();};w.appendChild(btnAll);for(var i=1;i<=4;i++){(function(wn){var b=document.createElement('button');var cnt=data.cams.filter(function(x){return wingOf(x.id)===wn}).length;b.textContent=wingNames[wn]+' ('+cnt+')';if(wingFilter===wn)b.className='sel';b.onclick=function(){wingFilter=wn;render();};w.appendChild(b);})(i);}}

function render(){
  renderFilters();renderWingbar();
  var q=(document.getElementById('search').value||'').toLowerCase();
  var list=data.cams.filter(function(c){return (filter==='all'||c.status===filter)&&(wingFilter==='all'||wingOf(c.id)===wingFilter)&&((c.id+' '+(c.sort||'')+' '+(c.batch||'')+' '+(c.crop||'')).toLowerCase().indexOf(q)>=0)});
  var wingsToShow = wingFilter==='all'?[1,2,3,4]:[wingFilter];
  var grid=document.getElementById('grid');
  grid.innerHTML='';
  wingsToShow.forEach(function(wn){
    var inWing=list.filter(function(c){return wingOf(c.id)===wn});
    if(inWing.length===0)return;
    var sec=document.createElement('div');sec.className='wing-section';
    var title=document.createElement('div');title.className='wing-title';
    title.innerHTML=wingNames[wn]+' <span>'+inWing.length+' камер</span>';
    sec.appendChild(title);
    var g=document.createElement('div');g.className='grid';
    g.innerHTML=inWing.map(function(c){return '<div class="cam '+c.status+' '+(selected===c.id?'selected':'')+'" onclick="selectCam('+c.id+')"><div class="num">● '+String(c.id).padStart(2,'0')+'</div><div class="sort">'+(c.sort||'—')+'</div><div class="qty">'+(c.qty||0).toLocaleString('ru-RU')+' кг</div><div class="status"><span class="dot"></span>'+(names[c.status]||c.status)+'</div></div>'}).join('');
    sec.appendChild(g);
    grid.appendChild(sec);
  });
  var counts={};data.cams.forEach(function(c){counts[c.status]=(counts[c.status]||0)+1});
  document.getElementById('summary').textContent='Хранение: '+(counts.storage||0)+' · Обработка: '+(counts.process||0)+' · РГС: '+(counts.rgs||0)+' · Неактивные: '+(counts.inactive||0)+' · Пустые: '+(counts.empty||0)+' · Проблема: '+(counts.problem||0);
  renderPanel();
}
function selectCam(id){selected=id;render();}

function renderPanel(){
  var c=data.cams.find(function(x){return x.id===selected});if(!c)return;
  var cid=String(c.id).padStart(2,'0');
  var hist=data.journal.filter(function(x){return x.cam===cid}).slice().reverse();
  var h='';
  if(hist.length){
    h='<div class="hist-scroll">';
    for(var i=0;i<hist.length;i++){h+='<div class="event"><b>'+hist[i].op+'</b><small>'+hist[i].time+'</small></div>';}
    h+='</div>';
  }else{h='<div style="color:#687785;font-size:12px">История пока пуста</div>';}
  document.getElementById('panel').innerHTML=
    '<h2>🍎 Камера №'+cid+' <span class="badge">'+(names[c.status]||c.status)+'</span></h2>'+
    '<div class="info"><div class="row"><span>Крыло</span><b>'+wingNames[wingOf(c.id)]+'</b></div><div class="row"><span>Культура</span><b>'+(c.crop||'—')+'</b></div><div class="row"><span>Сорт</span><b>'+(c.sort||'—')+'</b></div><div class="row"><span>Партия</span><b>'+(c.batch||'—')+'</b></div><div class="row"><span>Количество</span><b>'+(c.qty||0).toLocaleString('ru-RU')+' кг</b></div></div>'+
    '<div class="info"><div class="row"><span>Температура</span><b>'+(c.temp!=null?c.temp+' °C':'—')+'</b></div><div class="row"><span>Влажность</span><b>'+(c.hum!=null?c.hum+' %':'—')+'</b></div><div class="row"><span>Оператор</span><b>'+(c.operator||'—')+'</b></div></div>'+
    '<div class="buttons"><button class="warn" onclick="quick('+c.id+',\'process\')">Обработка</button><button class="primary" onclick="quick('+c.id+',\'rgs\')">РГС</button><button class="green" onclick="quick('+c.id+',\'storage\')">Хранение</button></div>'+
    '<button style="width:100%" onclick="openForm('+c.id+')">✎ Редактировать</button>'+
    '<div class="history"><h3>История операций <span>'+hist.length+' записей</span></h3>'+h+'</div>';
}
function log(c,op){data.journal.push({time:now(),cam:String(c.id).padStart(2,'0'),wing:wingOf(c.id),op:op,sort:c.sort,batch:c.batch,qty:c.qty});}

function quick(id,st){
  var c=data.cams.find(function(x){return x.id===id});
  c.status=st;
  var opName=st==='process'?'Начало обработки':st==='rgs'?'Начало РГС':'Изменение статуса';
  log(c,opName);save();render();
}

function openForm(id){
  var c=data.cams.find(function(x){return x.id===id});selected=id;
  var fields=['status','crop','sort','batch','qty','temp','hum','operator','note'];
  for(var i=0;i<fields.length;i++){var k=fields[i];var el=document.getElementById('f'+k.charAt(0).toUpperCase()+k.slice(1));if(el)el.value=c[k]!=null?c[k]:'';}
  document.getElementById('modal').classList.add('open');
}
function closeForm(){document.getElementById('modal').classList.remove('open');}
function saveForm(){
  var c=data.cams.find(function(x){return x.id===selected});
  c.status=document.getElementById('fStatus').value;
  c.crop=document.getElementById('fCrop').value;
  c.sort=document.getElementById('fSort').value;
  c.batch=document.getElementById('fBatch').value;
  c.qty=Number(document.getElementById('fQty').value)||0;
  c.temp=document.getElementById('fTemp').value===''?null:Number(document.getElementById('fTemp').value);
  c.hum=document.getElementById('fHum').value===''?null:Number(document.getElementById('fHum').value);
  c.operator=document.getElementById('fOperator').value;
  c.note=document.getElementById('fNote').value;
  log(c,'Изменение данных');save();closeForm();render();
}

function openAllHistory(){
  var body=document.getElementById('histBody');
  var all=data.journal.slice().reverse();
  body.innerHTML=all.map(function(x){
    var wing=x.wing!=null?x.wing:wingOf(parseInt(x.cam,10));
    return '<tr><td>'+x.time+'</td><td>'+x.cam+'</td><td>'+(wingNames[wing]||'—')+'</td><td>'+x.op+'</td><td>'+(x.sort||'—')+'</td><td>'+(x.batch||'—')+'</td><td>'+(x.qty?x.qty.toLocaleString('ru-RU')+' кг':'—')+'</td></tr>';
  }).join('')||'<tr><td colspan="7">Операций пока нет</td></tr>';
  document.getElementById('histModal').classList.add('open');
}
function closeHist(){document.getElementById('histModal').classList.remove('open');}

function exportData(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='fruitstore-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importData(){document.getElementById('importFile').click();}
document.getElementById('importFile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{var parsed=JSON.parse(r.result);if(parsed.cams){data=parsed;if(!data.journal)data.journal=[];save();render();alert('Данные загружены');}else alert('Неверный формат файла');}catch(err){alert('Ошибка чтения файла: '+err.message);}};
  r.readAsText(f);
});
function resetData(){
  if(!confirm('Сбросить все данные и вернуть 56 камер по умолчанию?'))return;
  data={cams:seed(),journal:[]};save();render();
}

document.getElementById('search').addEventListener('input',render);
render();
</script>
</body>
</html>
