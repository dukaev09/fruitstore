<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Фруктохранилище</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#172235">
<link rel="icon" type="image/png" href="/app-icon.png">
<link rel="apple-touch-icon" href="/app-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фруктохранилище">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,Arial,sans-serif;background:#eef1f5;color:#172033;-webkit-font-smoothing:antialiased}
html,body{overflow-x:hidden;max-width:100%}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #4d89ee;outline-offset:2px}
.header{background:#172235;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 18px;border-bottom:1px solid #25344b}
.hwrap{max-width:1400px;margin:auto;display:flex;align-items:center;gap:14px}
.logo{width:50px;height:50px;background:#fff;border-radius:13px;display:grid;place-items:center;font-size:29px;flex:0 0 auto;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.brand{font-size:21px;font-weight:800}
.sub{color:#aebbd0;font-size:12px;margin-top:3px}
.hspacer{flex:1}
.hbtns{display:flex;gap:7px;flex-wrap:wrap}
.hbtns button,.user-bar button{background:#202e43;color:#dbe5f2;border:1px solid #34445d;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700}
.user-bar{background:#202e43;color:#dbe5f2;padding:8px 20px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.user-bar button{background:transparent;padding:5px 10px;font-size:11px}
main{max-width:1400px;margin:auto;padding:18px 20px 40px}
#q{width:100%;margin-bottom:11px;padding:11px 13px;border-radius:10px}
.filters,.wingbar{display:flex;gap:7px;margin-bottom:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar,.wingbar::-webkit-scrollbar{display:none}
.filters button,.wingbar button{flex:0 0 auto;white-space:nowrap;background:#fff;border:1px solid #d5dce6;color:#273449;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:700}
.filters button.sel,.wingbar button.sel{background:#1f4f8f;color:#fff;border-color:#1f4f8f}
.chip-icon{margin-right:6px}
.stats{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:9px;margin:16px 0 20px}
.stat{background:#fff;border-radius:13px;padding:14px;display:flex;gap:11px;border:1px solid #d9e0e9;box-shadow:0 3px 10px rgba(16,24,40,.05)}
.stat-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:#edf2f8;flex:0 0 auto}
.stat .lbl{font-size:10px;color:#6f84a3;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.stat .val{font-size:21px;font-weight:800;margin-top:4px;white-space:nowrap}
.stat .sub2{font-size:10px;color:#7890ae;margin-top:2px}
.stat-primary{background:#1f4f8f;color:#fff;border-color:#1f4f8f}
.stat-primary .stat-icon{background:rgba(255,255,255,.16)}
.stat-primary .lbl,.stat-primary .sub2{color:#dbe5f2}
.content-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d7dee8;padding-bottom:9px;margin:5px 0 11px}
.content-head h1{font-size:20px;margin:0}
.result-count{font-size:12px;color:#7890ae;font-weight:600}
.wing-title{width:100%;text-align:left;color:inherit;background:#fff;border:1px solid #d8dee8;border-radius:11px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;box-shadow:0 2px 8px rgba(16,24,40,.04);margin-bottom:9px}
.wt-left{display:flex;align-items:center;gap:8px}
.wt-count{color:#8092ad;font-weight:600;font-size:12px}
.arrow{color:#7c8fae;transition:.2s}
.collapsed .arrow{transform:rotate(-90deg)}
.wing-section{margin-bottom:15px}
.wing-section.collapsed .grid{display:none}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.cam{background:#fff;border:1px solid #d5dce6;border-radius:11px;padding:13px;cursor:pointer;position:relative;transition:.15s;box-shadow:0 2px 9px rgba(16,24,40,.045);min-height:170px;text-align:left;color:inherit;display:block;width:100%}
.cam:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#2563a6);border-radius:11px 0 0 11px}
.cam:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(16,24,40,.09)}
.cam.storage{--c:#2563a6;--p:#c9dced;--t:#245b91}
.cam.rgs{--c:#3f7d58;--p:#c9dfd2;--t:#356b4c;background:#f7faff}
.cam.process{--c:#c9791b;--p:#e6cfb0;--t:#955816;background:#fffaf1}
.cam.problem{--c:#c53b3b;--p:#e8c3c3;--t:#a52f2f;background:#fff6f6}
.cam.empty{--c:#c8ced6;--p:#e1e4e8;--t:#687384;background:#f7f8fa}
.cam.inactive{--c:#1f2933;--p:#cbd0d5;--t:#27313b;background:#eef1f4}
.cam-top{display:flex;justify-content:space-between;align-items:center}
.num{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.ci{width:22px;height:22px;object-fit:contain}
.cam-arrow{width:25px;height:25px;border-radius:50%;background:#f0f4fa;display:grid;place-items:center;color:#4d89ee;font-size:15px}
.cam .sort{font-size:14px;margin-top:13px;font-weight:800;overflow-wrap:anywhere}
.cam .qty{font-size:12px;color:#7185a2;margin-top:4px}
.cam .batch{font-size:11px;color:#8b9bb5;margin-top:3px;font-weight:700;overflow-wrap:anywhere}
.status-pill{display:inline-flex;align-items:center;gap:5px;margin-top:11px;padding:4px 9px;border-radius:7px;font-size:11px;font-weight:700;background:var(--p);color:var(--t)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.cam-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:11px;padding-top:9px;border-top:1px solid #eef2f7;font-size:10px;color:#7186a3;font-weight:600}
.empty-msg{text-align:center;color:#7890ae;padding:40px 10px;font-weight:600}
.modal{display:none;position:fixed;inset:0;background:rgba(16,24,40,.62);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.modalbox{background:#fff;border-radius:14px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(16,24,40,.22)}
.modalbox h2{margin-top:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:#7488a4;font-weight:700}
input,select,textarea{border:1px solid #dfe7f1;border-radius:10px;padding:10px;font-size:16px;background:#fff;color:inherit;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:#7ca7f5;box-shadow:0 0 0 3px rgba(40,117,246,.1)}
textarea{min-height:65px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal-actions button{padding:10px 16px;border-radius:9px;font-weight:700;font-size:13px;border:1px solid #dfe7f1;background:#fff}
.modal-actions button.primary,.btn-full.primary{background:#1f4f8f;color:#fff;border-color:#1f4f8f}
.modal-actions button:disabled{opacity:.6}
.view-info{border:1px solid #e3eaf3;border-radius:12px;padding:11px 13px;margin:9px 0}
.vrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px;border-bottom:1px solid #f0f3f7}
.vrow:last-child{border-bottom:none}
.vrow span:first-child{color:#7b8ea8;font-weight:600}
.vrow b{text-align:right;overflow-wrap:anywhere}
.btn-full{width:100%;padding:11px;border:1px solid #cfd7e2;background:#fff;border-radius:9px;font-weight:800;font-size:13px}
.tablewrap{max-height:60vh;overflow:auto;margin-top:12px}
.hist-table{width:100%;border-collapse:collapse;font-size:12px}
.hist-table th,.hist-table td{text-align:left;padding:9px;border-bottom:1px solid #edf2f7}
.hist-table td:nth-child(3){min-width:180px}
.hist-table th{color:#7185a2;background:#fff;font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eef7ff,#e5edff)}
.login-box{background:#fff;border-radius:18px;padding:30px 26px;width:min(420px,100%);box-shadow:0 20px 60px rgba(16,24,40,.15)}
.login-box h1{margin:0 0 6px;font-size:25px}
.login-box p{margin:0 0 20px;color:#7185a3;font-size:13px}
.login-box input{width:100%;margin-bottom:11px;padding:12px}
.login-box button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;font-size:14px;margin-bottom:7px}
.login-box .main{background:#1f4f8f;color:#fff}
.login-box .alt{background:#f0f4fa;color:#1f4f8f}
.err{background:#ffe6e6;color:#b4232f;padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:11px;display:none}
.err.show{display:block}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.9);display:none;align-items:center;justify-content:center;z-index:100;font-size:15px;color:#7185a3;font-weight:700}
.loading.show{display:flex}
.foot{text-align:center;color:#71839e;font-size:12px;font-weight:600;padding:0 18px 24px}
.foot i{display:block;color:#a8b3c4;font-size:11px;margin-bottom:10px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){
main{padding:12px}
.grid{grid-template-columns:repeat(2,1fr);gap:8px}
.stats{display:flex;overflow-x:auto;gap:8px;padding-bottom:5px}
.stat{min-width:155px;flex:0 0 auto}
.form{grid-template-columns:1fr}
.modalbox{padding:16px;border-radius:14px 14px 0 0;max-height:92vh}
.modal{align-items:flex-end;padding:0}
.header{padding:calc(14px + env(safe-area-inset-top)) 12px 14px}
.logo{width:44px;height:44px}
.brand{font-size:18px}
.hbtns button{padding:7px 9px;font-size:11px}
.user-bar{padding:8px 12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <form class="login-box" id="loginForm">
    <h1>🍎 Фруктохранилище</h1>
    <p>Войдите, чтобы получить доступ к камерам</p>
    <div id="loginErr" class="err" role="alert"></div>
    <input id="loginName" type="text" placeholder="Имя (латиница)" autocomplete="username" autocapitalize="none" required>
    <input id="loginPass" type="password" placeholder="Пароль (минимум 6 символов)" autocomplete="current-password" required>
    <button class="main" type="submit">Войти</button>
    <button class="alt" type="button" id="signupBtn" data-act="signup">Создать аккаунт</button>
  </form>
</div>

<div id="appScreen" style="display:none">
  <header class="header">
    <div class="hwrap">
      <div class="logo"><img src="/app-icon.png" alt="🍎" onerror="this.replaceWith('🍎')"></div>
      <div><div class="brand">Фруктохранилище</div><div class="sub" id="subTitle">Управление запасами</div></div>
      <div class="hspacer"></div>
      <div class="hbtns"><button data-act="history">📋 История</button></div>
      <div class="hbtns" id="adminBtns" style="display:none">
        <button data-act="export">⬇ Экспорт</button>
        <button data-act="import">⬆ Импорт</button>
      </div>
    </div>
  </header>
  <div class="user-bar"><span>Вы вошли как: <b id="userName">—</b></span><button data-act="logout">Выйти</button></div>
  <main>
    <input id="q" type="search" placeholder="Поиск: номер, сорт, партия, культура" autocomplete="off">
    <div class="filters" id="filters"></div>
    <div class="wingbar" id="wingbar"></div>
    <div class="stats" id="stats"></div>
    <div class="content-head"><h1>🧊 Камеры</h1><div class="result-count" id="resultCount">—</div></div>
    <div id="grid"></div>
  </main>
  <div class="foot"><i>Высокое качество низких температур</i>ООО «Фруттис Групп» · Чеченская Республика, Бачи-Юрт</div>
</div>

<div class="modal" id="viewModal"><div class="modalbox" style="width:min(560px,100%)">
  <h2 id="vmTitle"></h2><div id="vmContent"></div>
  <div class="modal-actions"><button data-close>Закрыть</button></div>
</div></div>

<div class="modal" id="editModal"><div class="modalbox">
  <h2>Данные камеры <span id="emNum"></span></h2>
  <form class="form" id="editForm"></form>
  <div class="modal-actions">
    <button data-close>Отмена</button>
    <button class="primary" id="saveBtn" data-act="save">Сохранить</button>
  </div>
</div></div>

<div class="modal" id="histModal"><div class="modalbox" style="width:min(900px,100%)">
  <h2>📋 История операций</h2>
  <div class="tablewrap"><table class="hist-table">
    <thead><tr><th>Дата</th><th>Камера</th><th>Действие</th><th>Пользователь</th></tr></thead>
    <tbody id="histBody"></tbody>
  </table></div>
  <div class="modal-actions"><button data-close>Закрыть</button></div>
</div></div>

<input type="file" id="importFile" accept=".json" hidden>
<div id="loading" class="loading">Загрузка…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, addDoc, collection, updateDoc, writeBatch, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQtB3vJh84ELKJg0qs0ycFSGw9Q62ZAOY",
  authDomain: "fruitstore-1eab9.firebaseapp.com",
  projectId: "fruitstore-1eab9",
  storageBucket: "fruitstore-1eab9.firebasestorage.app",
  messagingSenderId: "154714552355",
  appId: "1:154714552355:web:074164f3daef4c73e59996"
};

/* ===== Настройки ===== */
const ADMIN_EMAIL = 'adam@fruit.local'; // только для скрытия кнопок; настоящая защита — firestore.rules
const ALLOW_SIGNUP = true;              // false — скрыть «Создать аккаунт» (и отключите регистрацию в консоли Firebase)
const DOMAIN = '@fruit.local';
const WING_SIZE = 14, WINGS = 4;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const names = {all:'Все',storage:'Охлаждение',process:'Обработка',rgs:'На РГС',inactive:'Неактивные',problem:'Проблема',empty:'Пустые'};
const chipIcons = {all:'▦',storage:'❄',process:'⚙',rgs:'🧪',inactive:'⏸',problem:'🆘',empty:'◌'};
const wingName = n => 'Крыло ' + n;
/* key, подпись, тип, min, max, step, единица */
const FIELDS = [
  ['crop','Культура','text'],['sort','Сорт','text'],['batch','Партия','text'],
  ['qty','Количество, кг','num',0,1e7,1,' кг'],
  ['temp','Температура °C','num',-30,40,.1,' °C'],
  ['hum','Влажность %','num',0,100,1,' %'],
  ['o2','O₂ %','num',0,100,.1,' %'],
  ['co2','CO₂ %','num',0,100,.1,' %'],
  ['operator','Оператор','text'],
  ['loadAt','Дата загрузки','date'],['processAt','Дата обработки','date'],['rgsAt','Дата вывода на РГС','date']
];
const LABEL = Object.fromEntries(FIELDS.map(f => [f[0], f[1].replace(/, кг| °C| %/,'')]));
Object.assign(LABEL, {status:'Статус', note:'Примечание'});

/* ===== Утилиты ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmtNow = () => new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const todayIso = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const toIso = s => { const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s||''); return m ? m[3]+'-'+m[2]+'-'+m[1] : ''; };
const toDmy = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m ? m[3]+'.'+m[2]+'.'+m[1] : ''; };
const wingOf = id => Math.floor((id-1)/WING_SIZE)+1;
const showLoading = s => $('loading').classList.toggle('show', s);
const isAdmin = () => !!user && user.email === ADMIN_EMAIL;
const val = (v, u='') => v != null && v !== '' ? esc(v)+u : '—';

function culIcon(sort, crop){
  const s = ((sort||'')+' '+(crop||'')).toLowerCase();
  const map = [['груш','pear','🍐'],['морков','carrot','🥕'],['лук','onion','🧅'],['капуст','cabbage','🥬'],['свекл','beet','🟣'],['виноград','grapes','🍇'],['слив','plum','🟣']];
  const m = map.find(x => s.includes(x[0])) || [0,'apple','🍎'];
  return '<img src="/'+m[1]+'.png" class="ci" alt="" onerror="this.replaceWith(\''+m[2]+'\')">';
}

/* ===== Модальные окна (блокировка прокрутки в одном месте) ===== */
let scrollY = 0;
function openModal(id){
  if (!document.querySelector('.modal.open')){
    scrollY = window.scrollY;
    document.body.style.cssText = 'position:fixed;width:100%;top:-'+scrollY+'px';
  }
  $(id).classList.add('open');
}
function closeModal(id){
  $(id).classList.remove('open');
  if (!document.querySelector('.modal.open')){
    document.body.style.cssText = '';
    window.scrollTo(0, scrollY);
  }
}
function closeTopModal(){
  const open = [...document.querySelectorAll('.modal.open')].pop();
  if (open) closeModal(open.id);
}

/* ===== Состояние ===== */
let user = null, cams = [], journal = [], selected = null;
let filter = 'all', wingFilter = 'all', search = '', collapsed = {};
let unsubs = [], seeded = false;

/* ===== Вход ===== */
const loginErr = m => { $('loginErr').textContent = m; $('loginErr').classList.toggle('show', !!m); };
const authError = e => {
  const m = (e.code || e.message || '').toLowerCase();
  if (/invalid-credential|wrong-password|user-not-found/.test(m)) return 'Неверное имя или пароль';
  if (/too-many-requests/.test(m)) return 'Слишком много попыток. Подождите.';
  if (/network/.test(m)) return 'Нет соединения. Проверьте интернет или VPN.';
  if (/email-already-in-use/.test(m)) return 'Такое имя уже занято. Нажмите «Войти».';
  if (/weak-password/.test(m)) return 'Слишком простой пароль';
  if (/operation-not-allowed/.test(m)) return 'Регистрация отключена. Обратитесь к администратору.';
  return 'Ошибка: ' + m;
};
function credentials(signup){
  const name = $('loginName').value.trim().toLowerCase();
  const pass = $('loginPass').value;
  if (!name || !pass){ loginErr('Введите имя и пароль'); return null; }
  if (signup){
    if (!/^[a-z0-9._-]{2,20}$/.test(name)){ loginErr('Имя: только латиница, цифры и . _ - (2–20 символов)'); return null; }
    if (pass.length < 6){ loginErr('Пароль: минимум 6 символов'); return null; }
  }
  return { email: name.includes('@') ? name : name + DOMAIN, pass };
}
async function doAuth(signup){
  loginErr('');
  const c = credentials(signup); if (!c) return;
  showLoading(true);
  try { await (signup ? createUserWithEmailAndPassword : signInWithEmailAndPassword)(auth, c.email, c.pass); }
  catch(e){ showLoading(false); loginErr(authError(e)); }
}

onAuthStateChanged(auth, u => {
  user = u;
  unsubs.forEach(f => f()); unsubs = []; seeded = false; cams = []; journal = [];
  if (u){
    $('loginScreen').style.display = 'none';
    $('appScreen').style.display = 'block';
    $('userName').textContent = u.email.replace(DOMAIN, '');
    $('adminBtns').style.display = isAdmin() ? 'flex' : 'none';
    showLoading(true);
    subscribe();
  } else {
    document.querySelectorAll('.modal.open').forEach(m => closeModal(m.id));
    $('loginScreen').style.display = 'flex';
    $('appScreen').style.display = 'none';
    $('loginPass').value = '';
    showLoading(false);
  }
});

/* ===== Данные ===== */
const cleanCam = c => {
  const id = Number(c.id);
  const o = { id, wing: wingOf(id), status: names[c.status] && c.status !== 'all' ? c.status : 'empty', note: String(c.note ?? '') };
  FIELDS.forEach(([k,,t]) => {
    if (t === 'num'){ const n = c[k] === '' || c[k] == null ? null : Number(c[k]); o[k] = Number.isFinite(n) ? n : (k === 'qty' ? 0 : null); }
    else o[k] = String(c[k] ?? '');
  });
  return o;
};
async function commitAll(list){
  for (let i = 0; i < list.length; i += 400){
    const b = writeBatch(db);
    list.slice(i, i+400).forEach(c => b.set(doc(db,'cameras','cam'+c.id), c));
    await b.commit();
  }
}
function seedCams(){
  const sorts = ['Голден','Гала','Фуджи','Груша','Айдаред','Морковь','Лук','Капуста','Свекла','Ред Чиф'];
  const veg = ['Морковь','Лук','Капуста','Свекла'];
  return Array.from({length: WING_SIZE*WINGS}, (_, k) => {
    const i = k+1, s = sorts[k % sorts.length];
    const st = i%14===0 ? 'empty' : i%7===0 ? 'rgs' : i%9===0 ? 'process' : 'storage';
    return cleanCam({id:i, status:st, crop: veg.includes(s) ? 'Овощи' : 'Яблоко', sort:s, batch:'П-'+(240+i),
      qty: st==='empty' ? 0 : (10+(i%16))*1000, temp:1.5, hum:90, o2:2.5, co2:3});
  });
}
function subscribe(){
  const fail = e => { showLoading(false); alert('Ошибка загрузки: ' + e.message); };
  unsubs.push(onSnapshot(collection(db,'cameras'), snap => {
    if (snap.empty && !snap.metadata.fromCache && isAdmin() && !seeded){
      seeded = true; commitAll(seedCams()).catch(fail); return;
    }
    cams = snap.docs.map(d => d.data()).sort((a,b) => a.id - b.id);
    showLoading(false);
    render();
  }, fail));
  unsubs.push(onSnapshot(query(collection(db,'journal'), orderBy('ts','desc'), limit(200)), snap => {
    journal = snap.docs.map(d => d.data());
    renderJournal();
  }, e => console.error(e)));
}

/* ===== Отрисовка ===== */
function renderStats(){
  let kg = 0, occ = 0, emp = 0, prob = 0, inact = 0;
  cams.forEach(c => {
    if (['storage','process','rgs'].includes(c.status)){ occ++; kg += c.qty || 0; }
    else if (c.status === 'empty') emp++;
    else if (c.status === 'problem') prob++;
    else if (c.status === 'inactive') inact++;
  });
  const st = (cls, ic, l, v, s) => '<div class="stat '+cls+'"><div class="stat-icon">'+ic+'</div><div><div class="lbl">'+l+'</div><div class="val">'+v+'</div><div class="sub2">'+s+'</div></div></div>';
  $('stats').innerHTML =
    st('stat-primary','📦','Всего',(kg/1000).toFixed(1)+' т',kg.toLocaleString('ru-RU')+' кг') +
    st('','❄️','Занято',occ+' / '+cams.length,'камер') +
    st('','◌','Свободно',emp,'камер') +
    st('','🆘','Проблемных',prob,'камер') +
    st('','⏸','Неактивных',inact,'камер');
  $('subTitle').textContent = 'Управление запасами · ' + cams.length + ' камер';
}
function renderChips(){
  $('filters').innerHTML = Object.keys(names).map(k => {
    const n = k === 'all' ? cams.length : cams.filter(c => c.status === k).length;
    return '<button data-filter="'+k+'"'+(filter===k?' class="sel"':'')+'><span class="chip-icon">'+chipIcons[k]+'</span>'+names[k]+' <strong>'+n+'</strong></button>';
  }).join('');
  let w = '<button data-wing="all"'+(wingFilter==='all'?' class="sel"':'')+'>⚪ Все крылья <strong>'+cams.length+'</strong></button>';
  for (let i = 1; i <= WINGS; i++)
    w += '<button data-wing="'+i+'"'+(wingFilter===i?' class="sel"':'')+'>⚪ '+wingName(i)+' <strong>'+cams.filter(c => c.wing === i).length+'</strong></button>';
  $('wingbar').innerHTML = w;
}
function camCard(c){
  return '<button class="cam '+esc(c.status)+'" data-cam="'+c.id+'">'+
    '<div class="cam-top"><div class="num">'+culIcon(c.sort,c.crop)+'№'+pad(c.id)+'</div><span class="cam-arrow">›</span></div>'+
    '<div class="sort">'+val(c.sort)+'</div><div class="batch">'+val(c.batch)+'</div>'+
    '<div class="qty">'+(c.qty||0).toLocaleString('ru-RU')+' кг</div>'+
    '<div class="status-pill"><span class="dot"></span>'+esc(names[c.status]||c.status)+'</div>'+
    '<div class="cam-meta"><span>🌡 '+val(c.temp,'°')+'</span><span>💧 '+val(c.hum,'%')+'</span><span>O₂ '+val(c.o2,'%')+'</span><span>CO₂ '+val(c.co2,'%')+'</span></div></button>';
}
function render(){
  renderStats(); renderChips();
  const q = search.trim().toLowerCase();
  const list = cams.filter(c =>
    (filter === 'all' || c.status === filter) &&
    (wingFilter === 'all' || c.wing === wingFilter) &&
    (!q || [pad(c.id), c.id, c.sort, c.batch, c.crop].join(' ').toLowerCase().includes(q)));
  let html = '';
  for (let w = 1; w <= WINGS; w++){
    const wc = list.filter(c => c.wing === w); if (!wc.length) continue;
    html += '<section class="wing-section'+(collapsed[w]?' collapsed':'')+'">'+
      '<button class="wing-title" data-toggle="'+w+'" aria-expanded="'+!collapsed[w]+'"><span class="wt-left"><span>⚪️</span><span>'+wingName(w)+'</span><span class="wt-count">'+wc.length+' камер</span></span><span class="arrow">⌄</span></button>'+
      '<div class="grid">'+wc.map(camCard).join('')+'</div></section>';
  }
  $('grid').innerHTML = html || '<div class="empty-msg">'+(cams.length ? 'Ничего не найдено. Измените фильтр или поиск.' : 'Камер пока нет.')+'</div>';
  $('resultCount').textContent = list.length + ' камер';
}
function renderJournal(){
  $('histBody').innerHTML = journal.map(e =>
    '<tr><td>'+esc(e.date)+'</td><td>'+esc(e.cam)+'</td><td>'+esc(e.action)+'</td><td>'+esc((e.user||'—').replace(DOMAIN,''))+'</td></tr>'
  ).join('') || '<tr><td colspan="4" style="text-align:center;padding:20px">История пуста</td></tr>';
}

/* ===== Просмотр и редактирование ===== */
function openView(id){
  const c = cams.find(x => x.id === id); if (!c) return;
  selected = id;
  const row = (l, v) => '<div class="vrow"><span>'+l+'</span><b>'+v+'</b></div>';
  const F = k => FIELDS.find(f => f[0] === k);
  const fv = k => val(c[k], F(k)[6] || '');
  $('vmTitle').innerHTML = culIcon(c.sort,c.crop) + ' Камера №' + pad(c.id);
  $('vmContent').innerHTML =
    '<div class="view-info">'+row('Статус',esc(names[c.status]||c.status))+row('Крыло',wingName(c.wing))+row('Культура',fv('crop'))+row('Сорт',fv('sort'))+row('Партия',fv('batch'))+row('Количество',(c.qty||0).toLocaleString('ru-RU')+' кг')+'</div>'+
    '<div class="view-info">'+row('Температура',fv('temp'))+row('Влажность',fv('hum'))+row('O₂',fv('o2'))+row('CO₂',fv('co2'))+'</div>'+
    '<div class="view-info">'+row('Загрузка',fv('loadAt'))+row('Обработка',fv('processAt'))+row('РГС',fv('rgsAt'))+row('Оператор',fv('operator'))+'</div>'+
    (c.note ? '<div class="view-info"><div class="vrow" style="flex-direction:column;gap:4px"><span>Примечание</span><b style="font-weight:500;text-align:left">'+esc(c.note)+'</b></div></div>' : '')+
    '<button class="btn-full primary" data-act="edit">✎ Редактировать</button>';
  openModal('viewModal');
}
function buildForm(){
  let h = '<div class="field"><label for="f_status">Статус</label><select id="f_status">'+
    Object.keys(names).filter(k => k !== 'all').map(k => '<option value="'+k+'">'+names[k]+'</option>').join('')+'</select></div>';
  FIELDS.forEach(([k,l,t,mn,mx,step]) => {
    h += '<div class="field"><label for="f_'+k+'">'+l+'</label><input id="f_'+k+'" '+
      (t==='num' ? 'type="number" inputmode="decimal" min="'+mn+'" max="'+mx+'" step="'+step+'"' : t==='date' ? 'type="date"' : 'type="text" maxlength="60"')+'></div>';
  });
  $('editForm').innerHTML = h + '<div class="field full"><label for="f_note">Примечание</label><textarea id="f_note" maxlength="500"></textarea></div>';
  $('f_status').onchange = () => {
    const s = $('f_status').value;
    if (s === 'process' && !$('f_processAt').value) $('f_processAt').value = todayIso();
    if (s === 'rgs' && !$('f_rgsAt').value) $('f_rgsAt').value = todayIso();
  };
}
function openForm(){
  const c = cams.find(x => x.id === selected); if (!c) return;
  $('emNum').textContent = '№' + pad(c.id);
  $('f_status').value = c.status;
  FIELDS.forEach(([k,,t]) => { $('f_'+k).value = t === 'date' ? toIso(c[k]) : (c[k] ?? ''); });
  $('f_note').value = c.note || '';
  closeModal('viewModal');
  openModal('editModal');
}
function collect(){
  const o = { status: $('f_status').value, note: $('f_note').value.trim() };
  for (const [k,l,t,mn,mx] of FIELDS){
    const raw = $('f_'+k).value.trim();
    if (t === 'num'){
      if (raw === '') o[k] = k === 'qty' ? 0 : null;
      else {
        const n = Number(raw);
        if (!Number.isFinite(n) || n < mn || n > mx){ alert(l + ': допустимо от ' + mn + ' до ' + mx); return null; }
        o[k] = n;
      }
    } else o[k] = t === 'date' ? toDmy(raw) : raw;
  }
  return o;
}
async function save(){
  const c = cams.find(x => x.id === selected); if (!c || !user) return;
  const upd = collect(); if (!upd) return;
  const changed = Object.keys(upd).filter(k => String(upd[k] ?? '') !== String(c[k] ?? ''));
  if (!changed.length){ closeModal('editModal'); return; }
  if (!confirm('Сохранить изменения?\n\nКамера №' + pad(c.id) + ' · ' + (c.sort||'—'))) return;
  const action = changed.includes('status') ? 'Статус: ' + names[c.status] + ' → ' + names[upd.status] + (changed.length > 1 ? ' (+ ещё ' + (changed.length-1) + ')' : '')
    : 'Изменено: ' + changed.map(k => LABEL[k]).join(', ');
  $('saveBtn').disabled = true; showLoading(true);
  try {
    const b = writeBatch(db);
    b.update(doc(db,'cameras','cam'+c.id), { ...upd, updatedBy: user.email });
    b.set(doc(collection(db,'journal')), { camId: c.id, cam: '№'+pad(c.id), action, user: user.email, ts: Date.now(), date: fmtNow() });
    await b.commit();
    closeModal('editModal');
  } catch(e){ alert('Не удалось сохранить: ' + e.message); }
  $('saveBtn').disabled = false; showLoading(false);
}

/* ===== Экспорт / импорт (только админ) ===== */
function exportData(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({cams, journal}, null, 2)], {type:'application/json'}));
  a.download = 'fruitstore-backup-' + todayIso() + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !isAdmin()) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const p = JSON.parse(r.result);
      if (!Array.isArray(p.cams)) throw new Error('Неверный формат файла');
      const list = p.cams.filter(c => Number.isInteger(Number(c.id)) && c.id >= 1 && c.id <= 500).map(cleanCam);
      if (!list.length) throw new Error('В файле нет камер');
      if (!confirm('Импортировать ' + list.length + ' камер? Текущие данные этих камер будут заменены.')) return;
      showLoading(true); await commitAll(list); showLoading(false); alert('Готово');
    } catch(err){ showLoading(false); alert('Ошибка импорта: ' + err.message); }
  };
  r.readAsText(f);
});

/* ===== События ===== */
if (!ALLOW_SIGNUP) $('signupBtn').style.display = 'none';
buildForm();
$('loginForm').addEventListener('submit', e => { e.preventDefault(); doAuth(false); });
$('q').addEventListener('input', e => { search = e.target.value; render(); });

document.addEventListener('click', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('modal')) return closeModal(t.id);
  const x = t.closest('[data-close],[data-act],[data-cam],[data-filter],[data-wing],[data-toggle]');
  if (!x) return;
  if (x.hasAttribute('data-close')) return closeTopModal();
  if (x.dataset.cam) return openView(Number(x.dataset.cam));
  if (x.dataset.filter) { filter = x.dataset.filter; return render(); }
  if (x.dataset.wing) { wingFilter = x.dataset.wing === 'all' ? 'all' : Number(x.dataset.wing); return render(); }
  if (x.dataset.toggle) { const w = x.dataset.toggle; collapsed[w] = !collapsed[w]; return render(); }
  const act = {
    signup: () => doAuth(true), logout: () => signOut(auth), edit: openForm, save,
    history: () => { renderJournal(); openModal('histModal'); },
    export: () => isAdmin() && exportData(),
    import: () => isAdmin() && $('importFile').click()
  }[x.dataset.act];
  if (act) act();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTopModal(); });
</script>
