<style>
:root{--bg:#eef1f5;--card:#fff;--text:#172033;--muted:#667085;--line:#d8dee8;--blue:#1f4f8f;--shadow:0 4px 14px rgba(16,24,40,.07)}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',-apple-system,Arial,sans-serif;background:#eef1f5;color:#172033;-webkit-font-smoothing:antialiased}
 html,body{overflow-x:hidden;max-width:100%}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.header{background:#172235;color:#fff;padding:18px 20px;border-bottom:1px solid #25344b}
.hwrap{max-width:1400px;margin:auto;display:flex;align-items:center;gap:14px}
.logo{width:50px;height:50px;background:#fff;border-radius:13px;display:grid;place-items:center;font-size:29px;flex:0 0 auto}
.brand{font-size:21px;font-weight:800}
.sub{color:#aebbd0;font-size:12px;margin-top:3px}
.hspacer{flex:1}
.hbtns{display:flex;gap:7px;flex-wrap:wrap}
.hbtns button{background:#202e43;color:#dbe5f2;border:1px solid #34445d;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700}
main{max-width:1400px;margin:auto;padding:18px 20px 80px}
.filters,.wingbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.filters::-webkit-scrollbar,.wingbar::-webkit-scrollbar{display:none}
.filters button,.wingbar button{background:#fff;border:1px solid #d5dce6;color:#273449;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:700}
.filters button.sel,.wingbar button.sel{background:#1f4f8f;color:#fff;border-color:#1f4f8f}
.chip-icon{margin-right:6px}
.stats{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:9px;margin:16px 0 20px}
.stat{background:#fff;border-radius:13px;padding:14px;display:flex;gap:11px;border:1px solid #d9e0e9;box-shadow:0 3px 10px rgba(16,24,40,.05)}
.stat-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:#edf2f8;flex:0 0 auto}
.stat .lbl{font-size:10px;color:#6f84a3;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.stat .val{font-size:21px;font-weight:800;margin-top:4px}
.stat .sub2{font-size:10px;color:#7890ae;margin-top:2px}
.stat-primary{background:#1f4f8f;color:#fff;border-color:#1f4f8f}
.stat-primary .stat-icon{background:rgba(255,255,255,.16)}
.stat-primary .lbl,.stat-primary .sub2{color:#dbe5f2}
.content-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d7dee8;padding-bottom:9px;margin:5px 0 11px}
.content-head h1{font-size:20px;margin:0}
.result-count{font-size:12px;color:#7890ae;font-weight:600}
.wing-section{margin-bottom:15px}
.wing-title{background:#fff;border:1px solid #d8dee8;border-radius:11px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:800;font-size:15px;box-shadow:0 2px 8px rgba(16,24,40,.04);margin-bottom:9px}
.wt-left{display:flex;align-items:center;gap:8px}
.wing-symbol{font-size:16px}
.wing-title .arrow{color:#7c8fae;transition:.2s}
.wing-title.collapsed .arrow{transform:rotate(-90deg)}
.wt-count{color:#8092ad;font-weight:600;font-size:12px}
.wing-cams{overflow:hidden;transition:max-height .25s ease}
.wing-cams.collapsed{max-height:0!important}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.cam{background:#fff;border:1px solid #d5dce6;border-radius:11px;padding:13px;cursor:pointer;position:relative;transition:.15s;box-shadow:0 2px 9px rgba(16,24,40,.045);min-height:170px}
.cam:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#35b87f;border-radius:11px 0 0 11px}
.cam:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(16,24,40,.09)}
.cam.storage{background:#fff}.cam.storage:before{background:#2563a6}
.cam.rgs{background:#f7faff}.cam.rgs:before{background:#3f7d58}
.cam.process{background:#fffaf1}.cam.process:before{background:#c9791b}
.cam.problem{background:#fff6f6}.cam.problem:before{background:#c53b3b}
.cam.empty{background:#f7f8fa}.cam.empty:before{background:#c8ced6}
.cam.inactive{background:#eef1f4}.cam.inactive:before{background:#1f2933}
.cam-top{display:flex;justify-content:space-between;align-items:center}
.cam .num{font-weight:800;font-size:15px}
.cam .num .cul{font-size:17px;margin-right:5px}
.ci{width:22px;height:22px;object-fit:contain;vertical-align:middle} 
.cam-arrow{width:25px;height:25px;border-radius:50%;background:#f0f4fa;display:grid;place-items:center;color:#4d89ee;font-size:15px}
.cam .sort{font-size:14px;margin-top:13px;font-weight:800}
.cam .qty{font-size:12px;color:#7185a2;margin-top:4px}
 .cam .batch{font-size:11px;color:#8b9bb5;margin-top:3px;font-weight:700}
.status-pill{display:inline-flex;align-items:center;gap:5px;margin-top:11px;padding:4px 9px;border-radius:7px;font-size:11px;font-weight:700;background:#e9eef5;color:#667b98}
.dot{width:8px;height:8px;border-radius:50%;background:#35b87f}
.cam.storage .status-pill{background:#c9dced;color:#245b91}
.cam.rgs .status-pill{background:#c9dfd2;color:#356b4c}
.cam.process .status-pill{background:#e6cfb0;color:#955816}
.cam.problem .status-pill{background:#e8c3c3;color:#a52f2f}
.cam.empty .status-pill{background:#e1e4e8;color:#687384}
.cam.inactive .status-pill{background:#cbd0d5;color:#27313b}
.cam.storage .dot{background:#2563a6}
.cam.rgs .dot{background:#3f7d58}
.cam.process .dot{background:#c9791b}
.cam.problem .dot{background:#c53b3b}
.cam.empty .dot{background:#c8ced6}
.cam.inactive .dot{background:#1f2933}
.cam-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:11px;padding-top:9px;border-top:1px solid #eef2f7;font-size:10px;color:#7186a3;font-weight:600}
.modal{display:none;position:fixed;inset:0;background:rgba(16,24,40,.62);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.modalbox{background:#fff;border-radius:14px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(16,24,40,.22)}
.modalbox h2{margin-top:0;font-size:18px;font-weight:800}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:#7488a4;font-weight:700}
input,select,textarea{border:1px solid #dfe7f1;border-radius:10px;padding:10px;font:inherit;font-size:14px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:#7ca7f5;box-shadow:0 0 0 3px rgba(40,117,246,.1)}
textarea{min-height:65px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal-actions button{padding:10px 16px;border-radius:9px;font-weight:700;font-size:13px;border:1px solid #dfe7f1;background:#fff}
.modal-actions button.primary{background:#1f4f8f;color:#fff;border-color:#1f4f8f}
.view-info{border:1px solid #e3eaf3;border-radius:12px;padding:11px 13px;margin:9px 0}
.view-info .vrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px;border-bottom:1px solid #f0f3f7}
.view-info .vrow:last-child{border-bottom:none}
.view-info .vrow span:first-child{color:#7b8ea8;font-weight:600}
.btn-full{width:100%;padding:11px;border:1px solid #cfd7e2;background:#fff;border-radius:9px;font-weight:800;font-size:13px}
.primary-action{background:#1f4f8f;color:#fff;border-color:#1f4f8f}
.hist-table{width:100%;border-collapse:collapse;font-size:12px}
.hist-table th,.hist-table td{text-align:left;padding:9px;border-bottom:1px solid #edf2f7;white-space:nowrap}
.hist-table th{color:#7185a2;background:#fff;font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eef7ff,#e5edff)}
.login-box{background:#fff;border-radius:18px;padding:30px 26px;width:min(420px,100%);box-shadow:0 20px 60px rgba(16,24,40,.15)}
.login-box h1{margin:0 0 6px;font-size:25px;display:flex;align-items:center;gap:9px}
.login-box p{margin:0 0 20px;color:#7185a3;font-size:13px}
.login-box input{width:100%;margin-bottom:11px;padding:12px;border:1px solid #dfe7f1;border-radius:10px;font-size:15px}
.login-box button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;font-size:14px;margin-bottom:7px}
.login-box button.main{background:#1f4f8f;color:#fff}
.login-box button.alt{background:#f0f4fa;color:#1f4f8f}
.err{background:#ffe6e6;color:#b4232f;padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:11px;display:none}
.err.show{display:block}
.user-bar{background:#202e43;color:#dbe5f2;padding:8px 20px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.user-bar button{background:transparent;color:#dbe5f2;border:1px solid #34445d;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.9);display:none;align-items:center;justify-content:center;z-index:100;font-size:15px;color:#7185a3;font-weight:700}
.loading.show{display:flex}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){
 main{padding:12px}
 .grid{grid-template-columns:repeat(2,1fr);gap:8px}
 .stats{display:flex;overflow-x:auto;gap:8px;padding-bottom:5px}
 .stat{min-width:155px;flex:0 0 auto}
 .form{grid-template-columns:1fr}
 .modalbox{padding:16px;border-radius:14px 14px 0 0}
 .modal{align-items:flex-end;padding:0}
 .filters,.wingbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px}
 .filters button,.wingbar button{flex:0 0 auto;white-space:nowrap}
 .header{padding:14px 12px}
 .logo{width:44px;height:44px;font-size:26px}
 .brand{font-size:18px}
 .hbtns button{padding:7px 9px;font-size:11px}
}
</style>
</head>

<script type="module">

function now(){return new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function todayDate(){var d=new Date();var dd=String(d.getDate()).padStart(2,'0');var mm=String(d.getMonth()+1).padStart(2,'0');return dd+'.'+mm+'.'+d.getFullYear();}
function wingOf(id){return Math.floor((id-1)/14)+1;}
function culIcon(sort,crop){
  var s=(sort||crop||'').toLowerCase();
  if(s.indexOf('груш')>=0)return '<img src="/pear.png" class="ci">';
  if(s.indexOf('морков')>=0)return '<img src="/carrot.png" class="ci">';
  if(s.indexOf('лук')>=0)return '<img src="/onion.png" class="ci">';
  if(s.indexOf('капуст')>=0)return '<img src="/cabbage.png" class="ci">';
  if(s.indexOf('свекл')>=0)return '<img src="/beet.png" class="ci">';
  if(s.indexOf('виноград')>=0)return '<img src="/grapes.png" class="ci">';
  if(s.indexOf('слив')>=0)return '<img src="/plum.png" class="ci">';
  return '<img src="/apple.png" class="ci">';
}
function showLoading(s){document.getElementById('loading').className=s?'loading show':'loading';}
function showLoginError(msg){var b=document.getElementById('loginErr');b.textContent=msg;b.className='err show';}
function hideLoginError(){document.getElementById('loginErr').className='err';}

window.doLogin=async function(){
  hideLoginError();
  var email=document.getElementById('loginEmail').value.trim();
  var pass=document.getElementById('loginPass').value;
  if(!email||!pass){showLoginError('Введите email и пароль');return;}
  showLoading(true);
  try{
    await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){
    showLoading(false);
    var m=(e.code||e.message||'').toLowerCase();
    if(m.indexOf('invalid-credential')>=0||m.indexOf('wrong-password')>=0||m.indexOf('user-not-found')>=0)showLoginError('Неверный email или пароль');
    else if(m.indexOf('too-many-requests')>=0)showLoginError('Слишком много попыток. Подождите.');
    else if(m.indexOf('network')>=0)showLoginError('Нет соединения. Проверьте VPN.');
    else showLoginError('Ошибка: '+m);
  }
};

window.doSignup=async function(){
  hideLoginError();
  var email=document.getElementById('loginEmail').value.trim();
  var pass=document.getElementById('loginPass').value;
  if(!email||!pass){showLoginError('Введите email и пароль');return;}
  if(pass.length<6){showLoginError('Пароль минимум 6 символов');return;}
  showLoading(true);
  try{
    await createUserWithEmailAndPassword(auth,email,pass);
  }catch(e){
    showLoading(false);
    var m=(e.code||e.message||'').toLowerCase();
    if(m.indexOf('email-already-in-use')>=0)showLoginError('Такой email уже есть. Нажмите «Войти».');
    else if(m.indexOf('weak-password')>=0)showLoginError('Слабый пароль');
    else if(m.indexOf('invalid-email')>=0)showLoginError('Некорректный email');
    else if(m.indexOf('network')>=0)showLoginError('Нет соединения. Проверьте VPN.');
    else showLoginError('Ошибка: '+m);
  }
};

window.doLogout=async function(){await signOut(auth);};

    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appScreen').style.display='block';
    document.getElementById('userEmail').textContent=user.email;

if(user.email === ADMIN_EMAIL){
  document.getElementById('adminBtns').style.display = 'flex';
}else{
  document.getElementById('adminBtns').style.display = 'none';
}
    await initData();
    subscribeData();
    showLoading(false);
  }else{
    currentUser=null;
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('appScreen').style.display='none';
    showLoading(false);
  }
});

function seedCams(){
  var sorts=['Голден','Гала','Фуджи','Груша','Айдаред','Морковь','Лук','Капуста','Свекла','Ред Чиф'];
  var a=[];
  for(var i=1;i<=56;i++){
    var st=i%14===0?'empty':i%7===0?'rgs':i%9===0?'process':'storage';
    var s=sorts[(i-1)%sorts.length];
    var crop=(s==='Морковь'||s==='Лук'||s==='Капуста'||s==='Свекла')?'Овощи':'Яблоко';
    var qty=st==='empty'?0:(10+(i%16))*1000;
    a.push({id:i,wing:wingOf(i),status:st,crop:crop,sort:s,batch:'П-'+(240+i),qty:qty,temp:1.5,hum:90,o2:2.5,co2:3.0,note:'',operator:'',loadAt:'',processAt:'',rgsAt:''});
  }
  return a;
}

async function initData(){
  showLoading(true);
  try{
    var snap=await getDocs(collection(db,'cameras'));
    if(snap.empty){
      var batch=writeBatch(db);
      seedCams().forEach(function(c){batch.set(doc(db,'cameras','cam'+c.id),c);});
      await batch.commit();
      snap=await getDocs(collection(db,'cameras'));
    }
    cams=[];
    snap.forEach(function(d){cams.push(d.data());});
    cams.sort(function(a,b){return a.id-b.id;});
    var jsnap=await getDocs(collection(db,'journal'));
    journal=[];
    jsnap.forEach(function(d){journal.push(d.data());});
    journal.sort(function(a,b){return (a.ts||0)-(b.ts||0);});
    render();
    showLoading(false);
  }catch(e){
    showLoading(false);
    alert('Ошибка загрузки: '+e.message);
  }
}

function subscribeData(){
  onSnapshot(collection(db,'cameras'),function(snap){
    cams=[];
    snap.forEach(function(d){cams.push(d.data());});
    cams.sort(function(a,b){return a.id-b.id;});
    render();
  });
  onSnapshot(collection(db,'journal'),function(snap){
    journal=[];
    snap.forEach(function(d){journal.push(d.data());});
    journal.sort(function(a,b){return (a.ts||0)-(b.ts||0);});
    renderJournalOnly();
  });
}

function renderStats(){
  var totalKg=0,occupied=0,empty_=0,problem=0,inactive=0;
  cams.forEach(function(c){
    if(c.status==='storage'||c.status==='process'||c.status==='rgs'){occupied++;totalKg+=(c.qty||0);}
    else if(c.status==='empty')empty_++;
    else if(c.status==='problem')problem++;
    else if(c.status==='inactive')inactive++;
  });
  var tons=(totalKg/1000).toFixed(1);
  document.getElementById('stats').innerHTML=
    '<div class="stat stat-primary"><div class="stat-icon">📦</div><div><div class="lbl">Всего</div><div class="val">'+tons+' т</div><div class="sub2">'+totalKg.toLocaleString('ru-RU')+' кг</div></div></div>'+
    '<div class="stat"><div class="stat-icon">❄️</div><div><div class="lbl">Занято</div><div class="val">'+occupied+' / 56</div><div class="sub2">камер</div></div></div>'+
    '<div class="stat"><div class="stat-icon">◌</div><div><div class="lbl">Свободно</div><div class="val">'+empty_+'</div><div class="sub2">камер</div></div></div>'+
    '<div class="stat"><div class="stat-icon">🆘</div><div><div class="lbl">Проблемных</div><div class="val">'+problem+'</div><div class="sub2">камер</div></div></div>'+
    '<div class="stat"><div class="stat-icon">⏸</div><div><div class="lbl">Неактивных</div><div class="val">'+inactive+'</div><div class="sub2">камер</div></div></div>';
}

function renderFilters(){
  var f=document.getElementById('filters');f.innerHTML='';
  var icons={all:'▦',storage:'❄',process:'⚙',rgs:'🧪',inactive:'⏸',problem:'🆘',empty:'◌'};
  Object.keys(names).forEach(function(k){
    var b=document.createElement('button');
    var cnt=k==='all'?cams.length:cams.filter(function(x){return x.status===k}).length;
    b.innerHTML='<span class="chip-icon">'+icons[k]+'</span>'+names[k]+' <strong>'+cnt+'</strong>';
    if(filter===k)b.className='sel';
    b.onclick=function(){filter=k;render();};
    f.appendChild(b);
  });
}

function renderWingbar(){
  var w=document.getElementById('wingbar');w.innerHTML='';
  var btnAll=document.createElement('button');
  btnAll.innerHTML='⚪ Все крылья <strong>'+cams.length+'</strong>';
  if(wingFilter==='all')btnAll.className='sel';
  btnAll.onclick=function(){wingFilter='all';render();};
  w.appendChild(btnAll);
  for(var i=1;i<=4;i++){(function(wn){
    var b=document.createElement('button');
    var cnt=cams.filter(function(x){return x.wing===wn}).length;
    b.innerHTML='⚪ '+wingNames[wn]+' <strong>'+cnt+'</strong>';
    if(wingFilter===wn)b.className='sel';
    b.onclick=function(){wingFilter=wn;render();};
    w.appendChild(b);
  })(i);}
}

window.toggleWing=function(wn){collapsed[wn]=!collapsed[wn];render();};

function render(){
  renderStats();renderFilters();renderWingbar();
  var list=cams.filter(function(c){
    return (filter==='all'||c.status===filter)&&(wingFilter==='all'||c.wing===wingFilter);
  });
  var grid=document.getElementById('grid');
  grid.innerHTML='';
  for(var w=1;w<=4;w++){
    var wingCams=list.filter(function(c){return c.wing===w});
    if(!wingCams.length)continue;
    var section=document.createElement('div');section.className='wing-section';
    var title=document.createElement('div');
    title.className='wing-title'+(collapsed[w]?' collapsed':'');
    (function(wn){title.onclick=function(){toggleWing(wn)}})(w);
    title.innerHTML='<div class="wt-left"><span class="wing-symbol">⚪️</span><span>'+wingNames[w]+'</span><span class="wt-count">'+wingCams.length+' камер</span></div><span class="arrow">⌄</span>';
    section.appendChild(title);
    var wrap=document.createElement('div');
    wrap.className='wing-cams'+(collapsed[w]?' collapsed':'');
    wrap.style.maxHeight=collapsed[w]?'0':'3000px';
    var g=document.createElement('div');g.className='grid';
    g.innerHTML=wingCams.map(function(c){
      var temp=c.temp!=null?c.temp+'°':'—';
      var hum=c.hum!=null?c.hum+'%':'—';
      var o2=c.o2!=null?c.o2+'%':'—';
      var co2=c.co2!=null?c.co2+'%':'—';
      return '<div class="cam '+c.status+'" onclick="tapCam('+c.id+')">'+
        '<div class="cam-top"><div class="num"><span class="cul">'+culIcon(c.sort,c.crop)+'</span>№'+String(c.id).padStart(2,'0')+'</div><span class="cam-arrow">›</span></div>'+
        '<div class="sort">'+(c.sort||'—')+'</div>'+
       '<div class="batch">'+(c.batch||'—')+'</div>'+
        '<div class="qty">'+(c.qty||0).toLocaleString('ru-RU')+' кг</div>'+
        '<div class="status-pill"><span class="dot"></span>'+(names[c.status]||c.status)+'</div>'+
        '<div class="cam-meta"><span>🌡 '+temp+'</span><span>💧 '+hum+'</span><span>O₂ '+o2+'</span><span>CO₂ '+co2+'</span></div>'+
      '</div>';
    }).join('');
    wrap.appendChild(g);
    section.appendChild(wrap);
    grid.appendChild(section);
  }
  document.getElementById('resultCount').textContent=list.length+' камер';
}

window.tapCam=function(id){selected=id;openView(id);};

window.openView=function(id){
  var c=cams.find(function(x){return x.id===id});if(!c)return;
  selected=id;
  var cid=String(c.id).padStart(2,'0');
  document.getElementById('vmTitle').innerHTML=culIcon(c.sort,c.crop)+' Камера №'+cid;
  document.getElementById('vmContent').innerHTML=
    '<div class="view-info"><div class="vrow"><span>Статус</span><b>'+(names[c.status]||c.status)+'</b></div><div class="vrow"><span>Крыло</span><b>'+wingNames[c.wing]+'</b></div><div class="vrow"><span>Культура</span><b>'+(c.crop||'—')+'</b></div><div class="vrow"><span>Сорт</span><b>'+(c.sort||'—')+'</b></div><div class="vrow"><span>Партия</span><b>'+(c.batch||'—')+'</b></div><div class="vrow"><span>Количество</span><b>'+(c.qty||0).toLocaleString('ru-RU')+' кг</b></div></div>'+
    '<div class="view-info"><div class="vrow"><span>Температура</span><b>'+(c.temp!=null?c.temp+' °C':'—')+'</b></div><div class="vrow"><span>Влажность</span><b>'+(c.hum!=null?c.hum+' %':'—')+'</b></div><div class="vrow"><span>O₂</span><b>'+(c.o2!=null?c.o2+' %':'—')+'</b></div><div class="vrow"><span>CO₂</span><b>'+(c.co2!=null?c.co2+' %':'—')+'</b></div></div>'+
    '<div class="view-info"><div class="vrow"><span>Загрузка</span><b>'+(c.loadAt||'—')+'</b></div><div class="vrow"><span>Обработка</span><b>'+(c.processAt||'—')+'</b></div><div class="vrow"><span>РГС</span><b>'+(c.rgsAt||'—')+'</b></div><div class="vrow"><span>Оператор</span><b>'+(c.operator||'—')+'</b></div></div>'+
    (c.note?'<div class="view-info"><div class="vrow" style="flex-direction:column;align-items:flex-start;gap:4px"><span>Примечание</span><b style="font-weight:500">'+c.note+'</b></div></div>':'')+
    '<button class="btn-full primary-action" onclick="closeView();openForm('+c.id+')">✎ Редактировать</button>';
  document.getElementById('viewModal').classList.add('open');
};
window.closeView=function(){document.getElementById('viewModal').classList.remove('open');};

window.openForm=function(id){
  var c=cams.find(function(x){return x.id===id});if(!c)return;
  selected=id;
  var fields=[['fStatus','status'],['fCrop','crop'],['fSort','sort'],['fBatch','batch'],['fQty','qty'],['fTemp','temp'],['fHum','hum'],['fO2','o2'],['fCo2','co2'],['fOperator','operator'],['fLoadAt','loadAt'],['fProcessAt','processAt'],['fRgsAt','rgsAt'],['fNote','note']];
  fields.forEach(function(f){
    var el=document.getElementById(f[0]);
    if(el)el.value=c[f[1]]!=null?c[f[1]]:'';
  });
  document.getElementById('editModal').classList.add('open');
};
window.closeForm=function(){document.getElementById('editModal').classList.remove('open');};

window.onStatusChange=function(){
  var st=document.getElementById('fStatus').value;
  var d=todayDate();
  if(st==='process'){var p=document.getElementById('fProcessAt');if(!p.value)p.value=d;}
  if(st==='rgs'){var r=document.getElementById('fRgsAt');if(!r.value)r.value=d;}
};

window.saveForm=async function(){
  var c=cams.find(function(x){return x.id===selected});if(!c)return;
  var oldStatus=c.status;
  var upd={
    status:document.getElementById('fStatus').value,
    crop:document.getElementById('fCrop').value,
    sort:document.getElementById('fSort').value,
    batch:document.getElementById('fBatch').value,
    qty:Number(document.getElementById('fQty').value)||0,
    temp:document.getElementById('fTemp').value===''?null:Number(document.getElementById('fTemp').value),
    hum:document.getElementById('fHum').value===''?null:Number(document.getElementById('fHum').value),
    o2:document.getElementById('fO2').value===''?null:Number(document.getElementById('fO2').value),
    co2:document.getElementById('fCo2').value===''?null:Number(document.getElementById('fCo2').value),
    operator:document.getElementById('fOperator').value,
    loadAt:document.getElementById('fLoadAt').value,
    processAt:document.getElementById('fProcessAt').value,
    rgsAt:document.getElementById('fRgsAt').value,
    note:document.getElementById('fNote').value,
    updatedBy:currentUser?currentUser.email:''
  };
  showLoading(true);
  try{
    await updateDoc(doc(db,'cameras','cam'+selected),upd);
    var action=oldStatus!==upd.status?'Статус: '+names[oldStatus]+' → '+names[upd.status]:'Изменение данных';
    await addDoc(collection(db,'journal'),{camId:selected,cam:'№'+String(selected).padStart(2,'0'),action:action,user:currentUser?currentUser.email:'',ts:Date.now(),date:now()});
    closeForm();
  }catch(e){
    alert('Ошибка: '+e.message);
  }
  showLoading(false);
};

function renderJournalOnly(){
  var body=document.getElementById('histBody');
  if(!body)return;
  var arr=journal.slice().reverse().slice(0,200);
  body.innerHTML=arr.map(function(e){
    return '<tr><td>'+e.date+'</td><td>'+e.cam+'</td><td>'+e.action+'</td><td>'+(e.user||'—')+'</td></tr>';
  }).join('')||'<tr><td colspan="4" style="text-align:center;padding:20px">История пуста</td></tr>';
}

window.openAllHistory=function(){renderJournalOnly();document.getElementById('histModal').classList.add('open');};
window.closeHist=function(){document.getElementById('histModal').classList.remove('open');};

window.exportData=function(){
  var blob=new Blob([JSON.stringify({cams:cams,journal:journal},null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='fruitstore-backup-'+todayDate()+'.json';
  a.click();
};
window.importData=function(){document.getElementById('importFile').click();};

document.getElementById('importFile').addEventListener('change',async function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=async function(){
    try{
      var parsed=JSON.parse(r.result);
      if(!parsed.cams||!Array.isArray(parsed.cams)){alert('Неверный формат');return;}
      if(!confirm('Импортировать '+parsed.cams.length+' камер?'))return;
      showLoading(true);
      var batch=writeBatch(db);
      parsed.cams.forEach(function(c){
        var id=Number(c.id)||0;if(!id)return;
        batch.set(doc(db,'cameras','cam'+id),c);
      });
      await batch.commit();
      showLoading(false);
      alert('Готово');
    }catch(err){
      showLoading(false);
      alert('Ошибка: '+err.message);
    }
  };
  r.readAsText(f);
});

 function lockBody(){
  document.body.style.overflow='hidden';
  document.body.style.position='fixed';
  document.body.style.width='100%';
  document.body.style.top='0';
}
function unlockBody(){
  document.body.style.overflow='';
  document.body.style.position='';
  document.body.style.width='';
  document.body.style.top='';
}

var _origOpen=window.openView;
window.openView=function(id){
  lockBody();
  _origOpen(id);
};
var _origOpenForm=window.openForm;
window.openForm=function(id){
  lockBody();
  _origOpenForm(id);
};
var _origOpenAllHistory=window.openAllHistory;
window.openAllHistory=function(){
  lockBody();
  _origOpenAllHistory();
};

var _origCloseView=window.closeView;
window.closeView=function(){
  _origCloseView();
  unlockBody();
};
var _origCloseForm=window.closeForm;
window.closeForm=function(){
  _origCloseForm();
  unlockBody();
};
var _origCloseHist=window.closeHist;
window.closeHist=function(){
  _origCloseHist();
  unlockBody();
};
document.querySelectorAll('.modal').forEach(function(m){
  m.addEventListener('click',function(e){
    if(e.target===m)m.classList.remove('open');
  });
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(function(m){m.classList.remove('open');});
});
</script>
</body>
</html>
