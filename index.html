<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Фруктохранилище — управление камерами</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f4f8fc;--card:#fff;--text:#10203d;--muted:#7184a4;--line:#e4ebf4;
 --blue:#2875f6;--blue2:#5a8df7;--green:#31b77b;--yellow:#f3a51b;--red:#ef5a62;
 --shadow:0 8px 28px rgba(42,76,124,.08);--radius:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#e8f3ff 0,#f4f8fc 35%,#f7f9fc 100%);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.header{background:linear-gradient(135deg,#eef7ff 0%,#eaf2ff 58%,#e5edff 100%);border-bottom:1px solid #dce7f5;padding:26px 24px 24px;position:relative;overflow:hidden}
.header:after{content:'';position:absolute;width:380px;height:380px;border-radius:50%;right:-120px;top:-260px;background:rgba(92,143,247,.13)}
.hwrap{max-width:1450px;margin:auto;display:flex;align-items:center;gap:15px;position:relative;z-index:1}
.logo{width:62px;height:62px;border-radius:19px;background:rgba(255,255,255,.8);box-shadow:0 6px 18px rgba(55,95,150,.1);display:grid;place-items:center;font-size:38px;flex:0 0 auto}
.brand{font-size:27px;font-weight:800;letter-spacing:-.8px}
.sub{color:#7890b3;font-size:14px;margin-top:5px;font-weight:500}
.hspacer{flex:1}
.header-tools{display:flex;align-items:center;gap:10px}
.temp-badge,.icon-btn{background:rgba(255,255,255,.8);border:1px solid rgba(209,222,239,.9);box-shadow:0 6px 18px rgba(55,95,150,.07);border-radius:16px}
.temp-badge{padding:10px 16px;display:flex;gap:10px;align-items:center}
.temp-badge .big{font-size:18px;font-weight:800}
.temp-badge small{display:block;color:#7890b3;font-size:10px;margin-top:2px}
.icon-btn{width:48px;height:48px;position:relative;font-size:21px}
.notif{position:absolute;right:-3px;top:-4px;background:#f05c65;color:white;border-radius:20px;font-size:10px;font-weight:800;padding:3px 6px;border:2px solid #edf4ff}
.header-actions{display:flex;gap:7px;margin-left:8px}
.header-actions button{border:0;background:rgba(255,255,255,.72);color:#345277;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:700}
main{max-width:1450px;margin:auto;padding:20px 24px 80px}
.filters,.wingbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters button,.wingbar button{border:1px solid #dfe7f2;background:rgba(255,255,255,.9);color:#233653;padding:11px 16px;border-radius:16px;font-size:13px;font-weight:700;box-shadow:0 4px 13px rgba(42,76,124,.045);transition:.18s}
.filters button:hover,.wingbar button:hover{transform:translateY(-1px);border-color:#c6d6ec}
.filters button.sel,.wingbar button.sel{background:linear-gradient(135deg,#2875f6,#4c83ef);color:white;border-color:transparent;box-shadow:0 8px 18px rgba(40,117,246,.22)}
.chip-icon{margin-right:7px;font-size:15px}
.filters strong,.wingbar strong{margin-left:3px}
.wingbar{padding-bottom:2px}
.stats{display:grid;grid-template-columns:1.35fr repeat(4,1fr);gap:12px;margin:18px 0 22px}
.stat{min-height:112px;border-radius:22px;padding:18px;display:flex;gap:13px;align-items:flex-start;border:1px solid rgba(218,229,243,.8);box-shadow:var(--shadow);background:white}
.stat-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:#edf5ff;flex:0 0 auto}
.stat .lbl{font-size:12px;color:#6f84a3;font-weight:700;margin-top:1px}
.stat .val{font-size:25px;font-weight:800;letter-spacing:-.6px;margin-top:5px}
.stat .sub2{font-size:11px;color:#7890ae;margin-top:3px}
.stat-primary{background:linear-gradient(135deg,#2875f6,#369ff0);color:white;border:0}
.stat-primary .stat-icon{background:rgba(255,255,255,.16)}
.stat-primary .lbl,.stat-primary .sub2{color:#e6f0ff}
.stat-green .stat-icon{background:#e8fbf2}
.stat-blue .stat-icon{background:#eaf3ff}
.stat-red .stat-icon{background:#fff0f1}
.stat-slate .stat-icon{background:#edf2f8}
.content-head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}
.content-head h1{font-size:20px;margin:0;display:flex;gap:10px;align-items:center;letter-spacing:-.4px}
.content-head h1 span{font-size:20px}
.result-count{font-size:12px;color:#7890ae;font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.wing-section{margin-bottom:20px}
.wing-title{font-size:16px;font-weight:800;color:#152844;margin:0 0 11px;padding:13px 15px;border-radius:16px;background:rgba(255,255,255,.82);border:1px solid #e2eaf4;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;box-shadow:0 4px 14px rgba(42,76,124,.035)}
.wt-left{display:flex;align-items:center;gap:9px}
.wing-symbol{font-size:18px}
.wing-title .arrow{color:#7c8fae;font-size:20px;transition:.2s;line-height:1}
.wing-title.collapsed .arrow{transform:rotate(-90deg)}
.wt-count{font-weight:600;color:#8092ad;font-size:12px}
.wing-cams{overflow:hidden;transition:max-height .25s ease,opacity .2s ease}
.wing-cams.collapsed{max-height:0!important;opacity:0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cam{background:white;border:1px solid #dce6f1;border-radius:19px;padding:15px;cursor:pointer;position:relative;transition:all .18s;overflow:hidden;min-height:192px;box-shadow:0 5px 18px rgba(42,76,124,.055)}
.cam:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green)}
.cam:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(42,76,124,.11);border-color:#c5d7ee}
.cam.selected{box-shadow:0 0 0 2px #4b88f7,0 12px 28px rgba(40,117,246,.14);border-color:#8bb2fa}
.cam.storage{background:linear-gradient(145deg,#f8fffb,#effbf5)}.cam.storage:before{background:#35b87f}
.cam.rgs{background:linear-gradient(145deg,#f8fbff,#edf6ff)}.cam.rgs:before{background:#287cf4}
.cam.process{background:linear-gradient(145deg,#fffdf7,#fff8e8)}.cam.process:before{background:#f3a51b}
.cam.problem{background:linear-gradient(145deg,#fffafa,#fff0f1)}.cam.problem:before{background:#ef5a62}
.cam.empty{background:linear-gradient(145deg,#fbfcfe,#f3f6fa);color:#64758f}.cam.empty:before{background:#91a3bc}
.cam.inactive{background:linear-gradient(145deg,#f3f6fa,#e9eef5);color:#5b6e89}.cam.inactive:before{background:#7185a3}
.cam-top{display:flex;justify-content:space-between;align-items:center}
.cam .num{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.cam .num .cul{font-size:19px}
.cam-arrow{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.8);display:grid;place-items:center;color:#4d89ee;font-size:18px;border:1px solid rgba(190,211,237,.7)}
.cam .sort{font-size:15px;margin-top:15px;font-weight:800;color:#142743;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam .qty{font-size:13px;color:#7185a2;margin-top:5px;font-weight:500}
.status-pill{display:inline-flex;align-items:center;gap:6px;margin-top:13px;padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.72);font-size:11px;font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;background:#35b87f}
.rgs .dot{background:#287cf4}.process .dot{background:#f3a51b}.problem .dot{background:#ef5a62}.empty .dot{background:#91a3bc}.inactive .dot{background:#7185a3}
.cam-meta{display:flex;gap:15px;margin-top:14px;padding-top:11px;border-top:1px solid rgba(179,197,219,.42);font-size:11px;color:#7186a3;font-weight:600}
.panel{background:rgba(255,255,255,.94);border:1px solid #dfe8f3;border-radius:22px;padding:19px;box-shadow:var(--shadow);position:sticky;top:16px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#8a9bb4;font-weight:800}
.panel h2{margin:3px 0 0;font-size:23px;letter-spacing:-.5px}
.badge{padding:6px 9px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap}
.badge-storage{background:#dcf8e9;color:#159160}.badge-rgs{background:#dcecff;color:#2773d7}.badge-process{background:#fff0c9;color:#b77900}.badge-problem{background:#ffe0e3;color:#c23843}.badge-empty,.badge-inactive{background:#e9eef5;color:#667b98}
.selected-name{font-size:13px;color:#7185a3;margin:8px 0 15px}
.climate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.climate>div{background:#f5f9fe;border-radius:13px;padding:10px 12px}
.climate span{display:block;color:#8295ae;font-size:10px;font-weight:600}
.climate b{display:block;font-size:17px;margin-top:3px}
.info{border:1px solid #e5ecf4;border-radius:14px;padding:8px 13px;margin:10px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:12px}
.row:not(:last-child){border-bottom:1px solid #eef2f7}
.row span:first-child{color:#8295ae;font-weight:600}
.btn-full{width:100%;padding:12px;border:1px solid #dfe7f1;background:white;border-radius:12px;cursor:pointer;font-weight:800;font-size:12px}
.primary-action{background:linear-gradient(135deg,#2875f6,#4c83ef);color:white;border-color:transparent;box-shadow:0 8px 18px rgba(40,117,246,.18)}
.history{margin-top:17px}
.history h3{font-size:13px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.history h3 span{font-size:10px;color:#8295ae;font-weight:600}
.event{border-left:3px solid #c9d7e8;padding:8px 0 8px 11px;font-size:11px;margin-bottom:5px}
.event b{display:block;font-weight:700}
.event small{color:#8496ae}
.hist-scroll{max-height:250px;overflow-y:auto;padding-right:5px}
 .modal{display:none;position:fixed;inset:0;background:rgba(19,37,65,.48);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.modalbox{background:white;border-radius:22px;width:min(650px,100%);padding:24px;max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(19,37,65,.22)}
.modalbox h2{margin-top:0;font-size:19px;font-weight:800}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:#7488a4;font-weight:700}
input,select,textarea{border:1px solid #dfe7f1;border-radius:11px;padding:11px;font:inherit;font-size:14px;background:white;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#7ca7f5;box-shadow:0 0 0 3px rgba(40,117,246,.1)}
textarea{min-height:70px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal-actions button{padding:11px 18px;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;font-size:13px;border:1px solid #dfe7f1;background:white;color:var(--text)}
.modal-actions button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.hist-table{width:100%;border-collapse:collapse;font-size:12px}
.hist-table th,.hist-table td{text-align:left;padding:10px;border-bottom:1px solid #edf2f7;white-space:nowrap}
.hist-table th{color:#7185a2;position:sticky;top:0;background:white;font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.view-info{border:1px solid #e3eaf3;border-radius:13px;padding:12px 14px;margin:10px 0}
.view-info .vrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px;border-bottom:1px solid #f0f3f7}
.view-info .vrow:last-child{border-bottom:none}
.view-info .vrow span:first-child{color:#7b8ea8;font-weight:600}
@media(max-width:1200px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,1fr)}.stat-primary{grid-column:span 1}}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.panel{position:static}.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){
 
 .header{padding:17px 14px 18px}
 .hwrap{gap:11px}
 .logo{width:50px;height:50px;border-radius:15px;font-size:30px}
 .brand{font-size:20px}
 .sub{font-size:11px}
 .temp-badge{display:none}
 .header-actions{display:none}
 .icon-btn{width:42px;height:42px}
 main{padding:13px 13px 28px}
 .filters,.wingbar{gap:7px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}
 .filters::-webkit-scrollbar,.wingbar::-webkit-scrollbar{display:none}
 .filters button,.wingbar button{white-space:nowrap;padding:10px 12px;border-radius:14px;font-size:12px}
 .stats{display:flex;overflow-x:auto;gap:9px;margin:12px 0 17px;padding-bottom:3px;scrollbar-width:none}
 .stats::-webkit-scrollbar{display:none}
 .stat{min-width:155px;min-height:100px;padding:14px;border-radius:18px}
 .stat .val{font-size:22px}
 .content-head h1{font-size:18px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .cam{min-height:176px;padding:12px;border-radius:17px}
 .cam .sort{font-size:13px;margin-top:13px}
 .cam .qty{font-size:12px}
 .cam-meta{gap:8px;font-size:10px}
 .wing-title{padding:11px 12px;border-radius:14px}
 .layout{display:block}
 .panel{margin-top:15px}
 .form{grid-template-columns:1fr}
 .field.full{grid-column:auto}
 .modalbox{padding:19px;border-radius:19px}
}

/* ===== iPhone / mobile app polish ===== */

  body{
    background:linear-gradient(180deg,#f4f8ff 0%,#f7f9fc 48%,#f4f8fc 100%);

  .wing-section{margin-bottom:17px}
  .wing-title{
    padding:15px 16px;
    min-height:58px;
    border-radius:19px;
    margin-bottom:10px;
    box-shadow:0 5px 20px rgba(42,76,124,.055);
    font-size:16px;
  }
  .wing-symbol{font-size:19px!important}
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

    min-height:175px;
    padding:13px 12px 12px;
    border-radius:20px;
    box-shadow:0 5px 18px rgba(42,76,124,.055);
  }

  .cam-top{gap:5px}
  .cam .num{font-size:14px}
  .cam .sort{font-size:15px;line-height:1.15;margin-top:12px;min-height:34px}
  .cam .qty{font-size:12px;margin-top:5px}
  .status-pill{font-size:10px;margin-top:11px;padding:6px 8px}
  .cam-meta{
    font-size:10px!important;

  }

  .modalbox h2{font-size:20px}

.fallback-ui{display:none}

@media(max-width:700px){
  .climate > div{min-height:58px}
  .cam-meta{flex-wrap:wrap}
  .cam-meta span{white-space:nowrap}
}


.mobile-edit-btn{
  margin-top:12px;
  background:linear-gradient(135deg,#2875f6,#4c83ef)!important;
  color:#fff!important;
  border-color:transparent!important;
  min-height:48px;
  box-shadow:0 8px 20px rgba(40,117,246,.22);
}

  .mobile-edit-btn{
    display:block;
    border-radius:15px;

/* ===== Mobile bottom-sheet behavior ===== */
@media (max-width:700px){
  #viewModal{
    z-index:30;
    align-items:flex-end;
  }
  #viewModal .modalbox{
    transform:translateY(0);
    animation:cameraSheetIn .28s cubic-bezier(.2,.8,.2,1);
    width:100%!important;
    max-height:84vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  #modal{
    z-index:50;
    align-items:flex-end;
  }
  #modal .modalbox{
    width:100%!important;
    max-height:92vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    animation:editSheetIn .28s cubic-bezier(.2,.8,.2,1);
  }
}
@keyframes cameraSheetIn{
  from{transform:translateY(100%);opacity:.65}
  to{transform:translateY(0);opacity:1}
}
@keyframes editSheetIn{
  from{transform:translateY(100%);opacity:.65}
  to{transform:translateY(0);opacity:1}
}


/* Realistic industrial status palette */
:root{
  --status-cooling:#2563a6;
  --status-processing:#c9791b;
  --status-rgs:#3f7d58;
  --status-inactive:#1f2933;
  --status-problem:#c53b3b;
  --status-empty:#ffffff;
}
.cam.storage{
  background:#dfe9f4;
  border-color:#b7cadf;
}
.cam.storage:before{background:var(--status-cooling)}
.cam.rgs{
  background:#dfeae3;
  border-color:#b7cfbf;
}
.cam.rgs:before{background:var(--status-rgs)}
.cam.process{
  background:#eee3d4;
  border-color:#d9c3a3;
}

<script>

const key='fruitstore_v12';
const keyCollapsed='fruitstore_collapsed_v5';
const names={all:'Все',storage:'Охлаждение',process:'Обработка',rgs:'На РГС',inactive:'Неактивные',problem:'Проблема',empty:'Пустые'};
const wingNames={1:'Крыло 1',2:'Крыло 2',3:'Крыло 3',4:'Крыло 4'};

function now(){
  return new Date().toLocaleString('ru-RU',{
    day:'2-digit',
    month:'2-digit',
    year:'numeric',
    hour:'2-digit',
    minute:'2-digit'
  })
}

function todayDate(){
  var d=new Date();
  var dd=String(d.getDate()).padStart(2,'0');
  var mm=String(d.getMonth()+1).padStart(2,'0');
  return dd+'.'+mm+'.'+d.getFullYear();
}

function wingOf(id){
  return Math.floor((id-1)/14)+1;
}

function culIcon(sort,crop){
  var s=(sort||crop||'').toLowerCase();
  if(s.indexOf('груш')>=0)return '🍐';
  if(s.indexOf('морков')>=0)return '🥕';
  if(s.indexOf('лук')>=0)return '🧅';
  if(s.indexOf('капуст')>=0)return '🥬';
  if(s.indexOf('свекл')>=0)return '🍠';
  if(s.indexOf('вишн')>=0)return '🍒';
  if(s.indexOf('виноград')>=0)return '🍇';
  return '🍎';
}

var data=null;
var collapsed={};
var selected=1;
var filter='all';
var wingFilter='all';
var lastTapped=null;

/* Безопасная загрузка сохранённых данных. Если в localStorage осталась
   старая/повреждённая версия данных, приложение автоматически создаст
   корректные 56 камер вместо остановки JavaScript. */

try{
  var stored=localStorage.getItem(key);
  data=stored?JSON.parse(stored):null;
}catch(e){
  data=null;
}

try{
  var storedCollapsed=localStorage.getItem(keyCollapsed);
  collapsed=storedCollapsed?JSON.parse(storedCollapsed):{};
  if(!collapsed || typeof collapsed!=='object' || Array.isArray(collapsed))
    collapsed={};
}catch(e){
  collapsed={};
}

function seed(){
  var sorts=[
    'Голден',
    'Гала',
    'Фуджи',
    'Груша',
    'Айдаред',
    'Морковь',
    'Лук',
    'Капуста',
    'Свекла',
    'Ред Чиф'
  ];

  var a=[];

  for(var i=1;i<=56;i++){
    var st=
      i%14===0?'empty':
      i%7===0?'rgs':
      i%9===0?'process':
      'storage';

    var s=sorts[(i-1)%sorts.length];

    var crop=
      (s==='Морковь'||
       s==='Лук'||
       s==='Капуста'||
       s==='Свекла')
      ?'Овощи'
      :'Яблоко';

    var qty=st==='empty'?0:(10+(i%16))*1000;

    a.push({
      id:i,
      wing:wingOf(i),
      status:st,
      crop:crop,
      sort:s,
      batch:'П-'+(240+i),
      qty:qty,
      temp:1.5,
      hum:90,
      o2:2.5,
      co2:3.0,
      note:'',
      operator:'Оператор',
      loadAt:'',
      processAt:'',
      rgsAt:''
    });
  }

  return a;
}

if(!data || !Array.isArray(data.cams) || data.cams.length!==56){
  data={
    cams:seed(),
    journal:[]
  };

  localStorage.setItem(key,JSON.stringify(data));

}else if(!Array.isArray(data.journal)){
  data.journal=[];
}

/* Заполняем отсутствующие поля, если данные были сохранены старой версией. */

data.cams=data.cams.map(function(c,i){
  c=c||{};

  c.id=Number(c.id)||i+1;
  c.wing=wingOf(c.id);
  c.status=c.status||'storage';
  c.crop=c.crop||'Яблоко';
  c.sort=c.sort||'Без названия';
  c.batch=c.batch||'П-'+(240+c.id);
  c.qty=Number(c.qty)||0;

  c.temp=
    (c.temp===null||c.temp==='')?
    null:
    Number(c.temp);

  c.hum=
    (c.hum===null||c.hum==='')?
    null:
    Number(c.hum);

  c.operator=c.operator||'Оператор';
  c.note=c.note||'';
  c.loadAt=c.loadAt||'';
  c.processAt=c.processAt||'';
  c.rgsAt=c.rgsAt||'';

  return c;
});

function save(){
  localStorage.setItem(key,JSON.stringify(data));
}

function saveCollapsed(){
  localStorage.setItem(keyCollapsed,JSON.stringify(collapsed));
}

function toggleWing(wn){
  collapsed[wn]=!collapsed[wn];
  saveCollapsed();
  render();
}

function renderStats(){
  var totalKg=0;
  var occupied=0;
  var empty_=0;
  var problem=0;
  var inactive=0;

  data.cams.forEach(function(c){
    if(
      c.status==='storage'||
      c.status==='process'||
      c.status==='rgs'
    ){
      occupied++;
      totalKg+=(c.qty||0);
    }else if(c.status==='empty'){
      empty_++;
    }else if(c.status==='problem'){
      problem++;
    }else if(c.status==='inactive'){
      inactive++;
    }
  });

  var tons=(totalKg/1000).toFixed(1);
  var avg=occupied?((totalKg/occupied)/1000).toFixed(1):'0.0';

  document.getElementById('stats').innerHTML=
    '<div class="stat stat-primary">'+
      '<div class="stat-icon">📦</div>'+
      '<div>'+
        '<div class="lbl">Всего продукции</div>'+
        '<div class="val">'+tons+' т</div>'+
        '<div class="sub2">'+totalKg.toLocaleString('ru-RU')+' кг на хранении</div>'+
      '</div>'+
    '</div>'+

    '<div class="stat stat-green">'+
      '<div class="stat-icon">❄️</div>'+
      '<div>'+
        '<div class="lbl">Занято камер</div>'+
        '<div class="val">'+occupied+' / 56</div>'+
        '<div class="sub2">с продукцией</div>'+
      '</div>'+
    '</div>'+

    '<div class="stat stat-blue">'+
      '<div class="stat-icon">◌</div>'+
      '<div>'+
        '<div class="lbl">Свободно</div>'+
        '<div class="val">'+empty_+'</div>'+
        '<div class="sub2">пустых камер</div>'+
      '</div>'+
    '</div>'+

    '<div class="stat stat-red">'+
      '<div class="stat-icon">🆘</div>'+
      '<div>'+
        '<div class="lbl">Проблемных</div>'+
        '<div class="val">'+problem+'</div>'+
        '<div class="sub2">требуют внимания</div>'+
      '</div>'+
    '</div>'+

    '<div class="stat stat-slate">'+
      '<div class="stat-icon">⏸</div>'+
      '<div>'+
        '<div class="lbl">Неактивных</div>'+
        '<div class="val">'+inactive+'</div>'+
        '<div class="sub2">отключено</div>'+
      '</div>'+
    '</div>';
}

function renderFilters(){
  var f=document.getElementById('filters');
  f.innerHTML='';

  var icons={
    all:'▦',
    storage:'❄',
    process:'⚙',
    rgs:'🧪',
    inactive:'⏸',
    problem:'🆘',
    empty:'◌'
  };

  Object.keys(names).forEach(function(k){
    var b=document.createElement('button');

    var cnt=
      k==='all'?
      data.cams.length:
      data.cams.filter(function(x){
        return x.status===k
      }).length;
       b.innerHTML='<span class="chip-icon">'+icons[k]+'</span>'+names[k]+' <strong>'+cnt+'</strong>';
    b.className=filter===k?'sel':'';
    b.onclick=function(){
      filter=k;
      render();
    };
    f.appendChild(b);
  });
}

function renderWings(){
  var wb=document.getElementById('wingbar');

  wb.innerHTML='';

  var allBtn=document.createElement('button');
  allBtn.innerHTML='⚪ Все крылья <strong>'+data.cams.length+'</strong>';
  allBtn.className=wingFilter==='all'?'sel':'';

  allBtn.onclick=function(){
    wingFilter='all';
    render();
  };

  wb.appendChild(allBtn);

  for(var i=1;i<=4;i++){
    var count=data.cams.filter(function(c){
      return c.wing===i;
    }).length;

    var b=document.createElement('button');

    b.innerHTML='⚪ '+wingNames[i]+' <strong>'+count+'</strong>';
    b.className=wingFilter===i?'sel':'';

    (function(wn){
      b.onclick=function(){
        wingFilter=wn;
        render();
      };
    })(i);

    wb.appendChild(b);
  }
}

function filteredCams(){
  return data.cams.filter(function(c){

    var statusOk=
      filter==='all'||
      c.status===filter;

    var wingOk=
      wingFilter==='all'||
      c.wing===wingFilter;

    return statusOk&&wingOk;
  });
}

function render(){
  renderStats();
  renderFilters();
  renderWings();

  var cams=filteredCams();

  document.getElementById('resultCount').textContent=
    cams.length+' '+(
      cams.length===1?
      'камера':
      cams.length>=2&&cams.length<=4?
      'камеры':
      'камер'
    );

  renderGrid(cams);
  renderPanel();

  var problems=data.cams.filter(function(c){
    return c.status==='problem';
  }).length;

  document.getElementById('notifCount').textContent=problems;
}

function renderGrid(cams){

  var grid=document.getElementById('grid');

  grid.innerHTML='';

  for(var w=1;w<=4;w++){

    var wingCams=cams.filter(function(c){
      return c.wing===w;
    });

    if(!wingCams.length)continue;

    var section=document.createElement('div');
    section.className='wing-section';

    var title=document.createElement('div');
    title.className='wing-title'+(collapsed[w]?' collapsed':'');
    title.innerHTML=
      '<div class="wt-left">'+
        '<span class="wing-symbol">⚪️</span>'+
        '<span>'+wingNames[w]+'</span>'+

      '</div>'+
      '<span class="arrow">⌄</span>';

      title.onclick=function(){

      };
    })(w);

    var wrap=document.createElement('div');
    wrap.className='wing-cams'+(collapsed[w]?' collapsed':'');

    if(!collapsed[w]){
      wrap.style.maxHeight='2000px';
    }else{

    }

    var g=document.createElement('div');
    g.className='grid';

    wingCams.forEach(function(c){

      var card=document.createElement('div');

      card.className='cam '+c.status+
        (selected===c.id?' selected':'');

        selected=c.id;

        renderPanel();

          openView(c.id);

        Number(c.temp).toFixed(1)+'°';

      var hum=
        c.hum===null||c.hum===undefined||c.hum===''?
        '—':
        Number(c.hum).toFixed(0)+'%';

      var o2=
        c.o2===null||c.o2===undefined||c.o2===''?
        '—':
        Number(c.o2).toFixed(1)+'%';

      var co2=
        c.co2===null||c.co2===undefined||c.co2===''?
        '—':
        Number(c.co2).toFixed(1)+'%';

      card.innerHTML=
        '<div class="cam-top">'+
          '<div class="num">'+
            '<span class="cul">'+icon+'</span>'+
            '№'+String(c.id).padStart(2,'0')+
          '</div>'+
          '<div class="cam-arrow">›</div>'+

          formatKg(c.qty)+

          '<span class="dot '+c.status+'"></span>'+
          statusText+
        '</div>'+

          '<span>💧 '+hum+'</span>'+

    grid.innerHTML=
      '<div style="background:#fff;border:1px solid #d8dee8;border-radius:14px;padding:28px;text-align:center;color:#71839e;font-size:13px">'+
      'Камеры по выбранным фильтрам не найдены'+
      '</div>';
  }

function formatKg(n){

  n=Number(n)||0;

  if(n>=1000000){
    return (n/1000000).toFixed(1)+' т';
  }

  if(n>=1000){
    return (n/1000).toFixed(1)+' т';
  }

  return n.toLocaleString('ru-RU')+' кг';
}

function escapeHtml(str){

  return String(str===undefined||str===null?'':str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function renderRecentHistory(id){

  var arr=data.journal.filter(function(x){
    return x.camId===id;
  }).slice().reverse().slice(0,8);

  if(!arr.length){
    return '<div style="color:#8496ae;font-size:11px;padding:8px 0">История пока пуста</div>';
  }

  return arr.map(function(e){

    return '<div class="event">'+
      '<b>'+escapeHtml(e.action||'Изменение')+'</b>'+
      '<small>'+escapeHtml(e.date||'')+
      (e.user?' · '+escapeHtml(e.user):'')+
      '</small>'+
    '</div>';

  }).join('');
}

function addJournal(camId,action){

  var c=data.cams.find(function(x){
    return x.id===camId;
  });

  data.journal.push({
    camId:camId,
    date:now(),
    action:action,
    user:c?c.operator||'Оператор':'Оператор',
    sort:c?c.sort:'',
    batch:c?c.batch:'',
    qty:c?c.qty:0
  });

  if(data.journal.length>1000){
    data.journal=data.journal.slice(-1000);
  }

  save();
}

  if(status==='rgs'){
    if(!document.getElementById('fO2').value)

      document.getElementById('fCo2').value='3.0';

    return x.id===selected;

  if(!c)return;

  var oldStatus=c.status;

  c.status=document.getElementById('fStatus').value;
  c.crop=document.getElementById('fCrop').value.trim();
  c.sort=document.getElementById('fSort').value.trim();
  c.batch=document.getElementById('fBatch').value.trim();
  c.qty=Number(document.getElementById('fQty').value)||0;

  var tempValue=document.getElementById('fTemp').value;
  c.temp=tempValue===''?null:Number(tempValue);

  var humValue=document.getElementById('fHum').value;
  c.hum=humValue===''?null:Number(humValue);

  var o2Value=document.getElementById('fO2').value;
  c.o2=o2Value===''?null:Number(o2Value);

  var co2Value=document.getElementById('fCo2').value;
  c.co2=co2Value===''?null:Number(co2Value);

  c.loadAt=document.getElementById('fLoadAt').value.trim();

  c.rgsAt=document.getElementById('fRgsAt').value.trim();
  c.note=document.getElementById('fNote').value.trim();

    'Статус: '+names[oldStatus]+' → '+names[c.status]:
    'Изменение данных камеры';

  addJournal(c.id,action);

  save();

 function exportData(){

function handleImportFile(e){
  var file=e.target.files && e.target.files[0];
  if(!file)return;

  var reader=new FileReader();

  reader.onload=function(){
    try{
      var imported=JSON.parse(reader.result);

      if(!Array.isArray(imported)){
        throw new Error('invalid');
      }

      var cleaned=imported.map(function(c,i){
        var x=Object.assign({},c);

        x.id=Number(x.id)||i+1;
        x.wing=Number(x.wing)||1;
        if(x.wing<1)x.wing=1;
        if(x.wing>4)x.wing=4;

        x.status=names[x.status]?x.status:'empty';
        x.crop=String(x.crop||'');
        x.sort=String(x.sort||'');
        x.batch=String(x.batch||'');
        x.qty=Number(x.qty)||0;
        x.temp=x.temp===''||x.temp==null?'':Number(x.temp);
        x.hum=x.hum===''||x.hum==null?'':Number(x.hum);
        x.o2=x.o2===''||x.o2==null?'':Number(x.o2);
        x.co2=x.co2===''||x.co2==null?'':Number(x.co2);

        x.note=String(x.note||'');
        x.operator=String(x.operator||'');
        x.loadAt=String(x.loadAt||'');
        x.processAt=String(x.processAt||'');
        x.rgsAt=String(x.rgsAt||'');

        if(!Array.isArray(x.history)){
          x.history=[];
        }

        return x;
      });

      if(!cleaned.length){
        throw new Error('empty');
      }

      if(!confirm('Импортировать '+cleaned.length+' камер? Текущие данные будут заменены.')){
        return;
      }

      data=cleaned;
      save();
      render();

      alert('Данные успешно импортированы');
    }catch(err){
      alert('Не удалось импортировать файл. Проверьте формат JSON.');
    }
  };

  reader.readAsText(file,'utf-8');
}

function resetData(){
  if(!confirm('Сбросить все данные камер к исходному состоянию?')){
    return;
  }

  if(!confirm('Все внесённые изменения будут удалены. Продолжить?')){

  localStorage.removeItem(keyCollapsed);

  save();
  saveCollapsed();

  closeForm();

  closeHist();
}

/* Удобное закрытие окна просмотра свайпом вниз на мобильных */

(function(){
  var sheet=document.getElementById('viewModal');
  if(!sheet)return;

  var startY=0;
  var currentY=0;
  var tracking=false;

  sheet.addEventListener('touchstart',function(e){
    if(!sheet.classList.contains('open'))return;

    startY=e.touches[0].clientY;
    currentY=startY;
    tracking=true;
  },{passive:true});

  sheet.addEventListener('touchmove',function(e){
    if(!tracking)return;

    currentY=e.touches[0].clientY;

    if(currentY-startY>0){
      sheet.style.transform='translateY('+(currentY-startY)+'px)';
    }
  },{passive:true});

  sheet.addEventListener('touchend',function(){
    if(!tracking)return;

    tracking=false;

    if(currentY-startY>100){
      closeView();
    }

    sheet.style.transform='';
  });
})();
